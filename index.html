<script>
// Dropbox API provider. Every method takes the workspace and keychain explicitly;
// an expired access token is refreshed and persisted transparently.
define('remote/dropbox', ['lib/net', 'lib/path', 'lib/fileTypes', 'lib/encoding', 'model/config'], (Net, Path, FileTypes, Encoding, Config) => {
	const DropboxService = {
		/* =====================================================================
		   AUXILIARY HELPERS
		===================================================================== */
		
		// Converts local filenames to absolute remote Dropbox paths
		_getFullPath(rootDir, filename = '') {
			const cleanRoot = Path.cleanPath(rootDir);
			const cleanFile = Path.cleanPath(filename);
			const combined = cleanRoot ? (cleanFile ? `${cleanRoot}/${cleanFile}` : cleanRoot) : cleanFile;
			return combined ? `/${combined}` : ''; // Dropbox strictly requires a leading slash; root is ""
		},

		// Slices the absolute Dropbox path back into a VFS relative path
		_stripRoot(rootDir, fullPath) {
			const rootPrefix = this._getFullPath(rootDir, '');
			if (!rootPrefix) return fullPath.substring(1); // Remove the leading slash
			return fullPath.substring(rootPrefix.length + 1); // +1 to drop the separator slash
		},

		_toHeaderSafeJson(obj) {
		    return JSON.stringify(obj).replace(/[^\x00-\x7f]/g, (c) => {
		        return "\\u" + ("000" + c.charCodeAt(0).toString(16)).slice(-4);
		    });
		},

		_getHeaders(keychain, isContentEndpoint = false) {
			if (!keychain || !keychain.token) throw new Error('Dropbox token missing in keychain.');
			const headers = { 'Authorization': `Bearer ${keychain.token}` };

			// RPC calls MUST have application/json. Content calls MUST NOT.
			if (!isContentEndpoint) headers['Content-Type'] = 'application/json';
			else headers['Content-Type'] = 'application/octet-stream';
			
			return headers;
		},

		async _refreshAccessToken(keychain) {
			const res = await Net.fetchWithTimeout('https://api.dropboxapi.com/oauth2/token', {
				method: 'POST',
				headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
				cache: 'no-store',
				body: new URLSearchParams({
					refresh_token: keychain.refreshToken,
					grant_type: 'refresh_token',
					client_id: keychain.appKey
				})
			});

			if (!res.ok) throw new Error('Dropbox session expired and refresh failed. Please re-link.');

			const data = await res.json();
			keychain.token = data.access_token;
			
			// Flush the mutated keychain reference directly to persistent storage
			Config.saveKeychains();
		},

		async _apiFetch(url, initOptions = {}, isContentEndpoint = false, customHeaders = {}, keychain) {
			const headers = this._getHeaders(keychain, isContentEndpoint);
			Object.assign(headers, customHeaders);

			// Dropbox /download strictly forbids Content-Type.
			if (url.includes('/download')) delete headers['Content-Type'];

			initOptions.headers = headers;
			initOptions.cache = 'no-store';
			
			let res = await Net.fetchWithTimeout(url, initOptions);

			// Intercept Auth Failures and Auto-Refresh
			if (res.status === 401 && keychain.refreshToken) {
				await this._refreshAccessToken(keychain);
				
				const retryHeaders = this._getHeaders(keychain, isContentEndpoint);
				Object.assign(retryHeaders, customHeaders);
				if (url.includes('/download')) delete retryHeaders['Content-Type'];
				
				initOptions.headers = retryHeaders;
				res = await Net.fetchWithTimeout(url, initOptions);
			}
			
			return res;
		},

		// Dropbox answers every endpoint-specific error with 409 and names it in
		// error_summary (e.g. "path/conflict/file/..", "path/insufficient_space/..").
		// Only a conflict means the remote moved on; the rest are reported as they are.
		async _endpointError(res, fallback) {
			const err = await res.json().catch(() => ({}));
			const summary = err.error_summary || '';
			if (res.status === 409 && /(^|\/)conflict\//.test(summary)) return new Error("Conflict: Remote has newer changes. Please Pull first.");
			return new Error(summary ? `Dropbox: ${summary.replace(/\/+\.*$/, '')}` : fallback);
		},

		/* =====================================================================
		   TREE OPERATIONS
		===================================================================== */
		
		async getTree(workspace, keychain) {
			let url = 'https://api.dropboxapi.com/2/files/list_folder';
			const targetPath = this._getFullPath(workspace.rootDir);
			
			let payload = { 
				path: targetPath, 
				recursive: !workspace.shallow, 
				limit: 1000 
			};
			
			let allEntries = [];
			let hasMore = true;

			while (hasMore) {
				const res = await this._apiFetch(url, { method: 'POST', body: JSON.stringify(payload) }, false, {}, keychain);
				
				if (!res.ok) {
					const err = await res.json().catch(() => ({}));
					throw new Error(err.error_summary || 'Failed to fetch Dropbox folder tree.');
				}
				
				const data = await res.json();
				allEntries = allEntries.concat(data.entries);

				if (data.has_more) {
					url = 'https://api.dropboxapi.com/2/files/list_folder/continue';
					payload = { cursor: data.cursor };
				} else {
					hasMore = false;
				}
			}

			// VFS Mapping: Filter stubs, strip chroot prefixes, map types
			const tree = allEntries
				.filter(i => i['.tag'] === 'file' || (workspace.shallow && i['.tag'] === 'folder'))
				.map(i => ({ 
					path: this._stripRoot(workspace.rootDir, i.path_display), 
					sha: i.rev || i.id, // Dropbox folders lack a 'rev', substitute 'id' for the stub
					type: i['.tag'] === 'folder' ? 'folder' : 'blob',
					size: i.size || 0
				}));

			return { tree };
		},

		/* =====================================================================
		   FILE OPERATIONS
		===================================================================== */
		
		async getFile(filename, workspace, keychain) {
			const fullPath = this._getFullPath(workspace.rootDir, filename);
			const customHeaders = { 'Dropbox-API-Arg': this._toHeaderSafeJson({ path: fullPath }) };
			
			const res = await this._apiFetch('https://content.dropboxapi.com/2/files/download', { method: 'POST' }, true, customHeaders, keychain);
			if (!res.ok) throw new Error("Failed to download file from Dropbox.");
			
			const rev = JSON.parse(res.headers.get('Dropbox-API-Result')).rev;
			
			if (!FileTypes.isTextFile(filename)) {
				const rawBlob = await res.blob();
				return { content: new Blob([rawBlob], { type: FileTypes.mimeTypeFor(filename) }), sha: rev };
			}

			return { content: Encoding.utoa(await res.text()), sha: rev };
		},

		async putFile(filename, base64Content, sha, commitMsg, workspace, keychain) {
			const fullPath = this._getFullPath(workspace.rootDir, filename);
			const binaryString = atob(base64Content);
			
			const bytes = new Uint8Array(binaryString.length);
			for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);

			const customHeaders = {
				'Dropbox-API-Arg': this._toHeaderSafeJson({
					path: fullPath,
					mode: sha ? { '.tag': 'update', update: sha } : { '.tag': 'add' },
					strict_conflict: true
				})
			};

			const res = await this._apiFetch('https://content.dropboxapi.com/2/files/upload', { 
				method: 'POST', 
				body: bytes 
			}, true, customHeaders, keychain);

			if (!res.ok) throw await this._endpointError(res, "Upload failed");
			
			return { content: { sha: (await res.json()).rev } };
		},
		
		async deleteFile(filename, sha, workspace, keychain) {
			const fullPath = this._getFullPath(workspace.rootDir, filename);
			const url = 'https://api.dropboxapi.com/2/files/delete_v2';
			// parent_rev: delete only if the file is still at the synced version.
			const payload = sha ? { path: fullPath, parent_rev: sha } : { path: fullPath };

			const res = await this._apiFetch(url, { method: 'POST', body: JSON.stringify(payload) }, false, {}, keychain);
			if (res.ok || res.status === 404) return;

			// A file that is already gone counts as deleted.
			const error = await this._endpointError(res, "Dropbox deletion failed.");
			if (res.status === 409 && /path_lookup\/not_found/.test(error.message)) return;
			throw error;
		},
		
		fileUploadSizeLimit() {
			return 150 * 1024 * 1024; // Standard 150MB un-chunked Dropbox limit
		}
	};

	return DropboxService;
});

<script>
// Dropbox OAuth (PKCE): send the user to Dropbox, then exchange the code
// for tokens when Dropbox redirects back to the app.
define('remote/dropboxAuth', ['model/config', 'lib/net', 'lib/pkce'], (Config, Net, Pkce) => ({
	async link(kcId) {
		const keychain = Config.keychains[kcId];
		const key = keychain.appKey;

		if (!key) return alert("Please enter your App Key first (and ensure it is saved).");

		const verifier = Pkce.generateCodeVerifier();
		const challenge = await Pkce.generateCodeChallenge(verifier);
		// Ties the redirect back to this request, so a link carrying someone
		// else's code can't attach their account to this keychain.
		const state = Pkce.generateCodeVerifier();

		sessionStorage.setItem('dbx_pkce_verifier', verifier);
		sessionStorage.setItem('dbx_pkce_keychain_id', kcId);
		sessionStorage.setItem('dbx_pkce_state', state);

		const redirectUri = window.location.origin + window.location.pathname;
		const authUrl = `https://www.dropbox.com/oauth2/authorize?client_id=${key}&response_type=code&code_challenge=${challenge}&code_challenge_method=S256&token_access_type=offline&state=${state}&redirect_uri=${encodeURIComponent(redirectUri)}`;
		window.location.href = authUrl;
	},

	// Returns true if this page load was a successful redirect back from Dropbox.
	async handleRedirect() {
		const params = new URLSearchParams(window.location.search);
		const code = params.get('code');
		const verifier = sessionStorage.getItem('dbx_pkce_verifier');
		const kcId = sessionStorage.getItem('dbx_pkce_keychain_id');
		const state = sessionStorage.getItem('dbx_pkce_state');

		if (!code || !verifier || !kcId) return false;

		window.history.replaceState({}, document.title, window.location.pathname);
		sessionStorage.removeItem('dbx_pkce_verifier');
		sessionStorage.removeItem('dbx_pkce_keychain_id');
		sessionStorage.removeItem('dbx_pkce_state');

		if (!state || params.get('state') !== state) {
			alert('Dropbox linking failed: the reply does not match the request made from this tab. Link again.');
			return false;
		}

		const keychain = Config.keychains[kcId];
		if (!keychain) return false;

		try {
			const redirectUri = window.location.origin + window.location.pathname;
			const res = await Net.fetchWithTimeout('https://api.dropboxapi.com/oauth2/token', {
				method: 'POST',
				headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
				body: new URLSearchParams({
					client_id: keychain.appKey,
					grant_type: 'authorization_code',
					code: code,
					code_verifier: verifier,
					redirect_uri: redirectUri
				})
			});

			const data = await res.json();

			if (!res.ok) {
				console.error("DROPBOX API ERROR:", data);
				throw new Error(data.error_description || data.error || "Unknown Auth Failure");
			}

			keychain.provider = 'dropbox';
			keychain.token = data.access_token;
			keychain.refreshToken = data.refresh_token;

			Config.saveKeychains();

			return true;
		} catch (err) {
			alert(`PKCE Linking failed: ${err.message}`);
			return false;
		}
	},
}));

<script>
// GitHub Contents/Git Data API provider (strictly network operations).
// Every method takes the workspace and keychain explicitly.
define('remote/github', ['lib/net', 'lib/path', 'lib/fileTypes', 'lib/encoding'], (Net, Path, FileTypes, Encoding) => {
	const GitHubService = {
		/* =====================================================================
		   AUXILIARY HELPERS
		===================================================================== */

		// Internal API fetcher for clean error handling and boilerplate reduction
		async _apiFetch(url, token, options = {}) {
			const res = await Net.fetchWithTimeout(url, {
				...options,
				headers: {
					'Authorization': `token ${token}`,
					'Accept': 'application/vnd.github.v3+json',
					...options.headers
				},
				cache: 'no-store'
			});

			if (!res.ok) {
				if (res.status === 404 && options.method === 'DELETE') return; // Ignore 404s on deletion
				if (res.status === 409) throw new Error("Conflict: Remote has newer changes. Please Pull first.");

				const errData = await res.json().catch(() => ({}));
				throw new Error(errData.message || `GitHub API error: ${res.status}`);
			}

			return res;
		},

		// Builds an API URL under /repos/{owner}/{repo}/. Path segments are
		// encoded one at a time, so '#', '%' and '?' in a file name stay part of
		// the path; '/' and ':' (which separates branch and path in a tree
		// revision such as "main:docs") are kept.
		_repoUrl({ host, owner, repo }, path) {
			const encodePath = (p) => p.split('/').map(seg => encodeURIComponent(seg).replace(/%3A/gi, ':')).join('/');
			return `${host}/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/${encodePath(path)}`;
		},

		// The VFS Chroot Translator: Converts local filenames to absolute remote paths
		_getFullPath(rootDir, filename) {
			const cleanRoot = Path.cleanPath(rootDir);
			// Only strip the leading slash from filename — trailing slashes on
			// file paths would be a bug upstream, but leading ones are routine.
			const cleanFile = (filename || '').replace(/^\/+/, '');
			return cleanRoot ? `${cleanRoot}/${cleanFile}` : cleanFile;
		},

		/* =====================================================================
		   TREE OPERATIONS (From previous design)
		===================================================================== */

		async _getShallowTree(workspace, keychain) {
			const safePath = Path.cleanPath(workspace.rootDir);

			const url = `${this._repoUrl(workspace, `contents/${safePath}`)}?ref=${encodeURIComponent(workspace.branch)}`;
			const res = await this._apiFetch(url, keychain.token);
			const contents = await res.json();

			if (!Array.isArray(contents)) throw new Error(`Not a directory: ${safePath}`);

			return contents.map(item => ({
				path: item.name, 
				sha: item.sha,
				type: item.type === 'dir' ? 'folder' : 'blob',
				size: item.size || 0
			}));
		},

		async _getDeepTree(workspace, keychain) {
			const safePath = Path.cleanPath(workspace.rootDir);
			const treeRev = `${workspace.branch}:${safePath}`;

			const url = `${this._repoUrl(workspace, `git/trees/${treeRev}`)}?recursive=1`;
			const res = await this._apiFetch(url, keychain.token);
			const treeData = await res.json();

			const tree = treeData.tree
				.filter(item => item.type === 'blob') 
				.map(item => ({
					path: item.path, 
					sha: item.sha,
					type: 'blob',
					size: item.size || 0
				}));
			// GitHub cuts recursive listings off at 100,000 entries / 7 MB.
			return { tree, truncated: !!treeData.truncated };
		},

		async getTree(workspace, keychain) {
			if (!keychain || !keychain.token) throw new Error("Missing credentials in keychain.");
			if (!workspace.owner || !workspace.repo) throw new Error("Repository owner and name are not configured.");

			if (workspace.shallow) return { tree: await this._getShallowTree(workspace, keychain), truncated: false };
			return this._getDeepTree(workspace, keychain);
		},

		/* =====================================================================
		   FILE OPERATIONS (Refined for VFS)
		===================================================================== */

		async getFile(filename, workspace, keychain) {
			const fullPath = this._getFullPath(workspace.rootDir, filename);
			const url = `${this._repoUrl(workspace, `contents/${fullPath}`)}?ref=${encodeURIComponent(workspace.branch)}`;

			const isText = FileTypes.isTextFile(filename);

			// For text, we request standard JSON (Base64). For binaries, we request raw bytes.
			const headers = isText 
				? {} 
				: { 'Accept': 'application/vnd.github.raw' };

			const res = await this._apiFetch(url, keychain.token, { headers });

			// Handle Binary Files: the raw response carries no sha, so hash the bytes.
			if (!isText) {
				const rawBlob = await res.blob();
				const content = new Blob([rawBlob], { type: FileTypes.mimeTypeFor(filename) });
				return { content, sha: await Encoding.gitBlobSha(content) };
			}

			// Handle Text Files. Over 1 MB the JSON form comes without content
			// (encoding "none"); refuse rather than pull an empty file (C1).
			const data = await res.json();
			if (data.encoding === 'none') throw new Error(`${filename} is over 1 MB, which GitHub doesn't send as text. Nothing was changed.`);
			return data;
		},

		async putFile(filename, contentBase64, sha, commitMsg, workspace, keychain) {
			const fullPath = this._getFullPath(workspace.rootDir, filename);
			const { branch } = workspace;
			const url = this._repoUrl(workspace, `contents/${fullPath}`);

			const payload = { 
				message: commitMsg || `Update ${filename}`, 
				content: contentBase64, 
				branch: branch 
			};
			if (sha) payload.sha = sha;

			const res = await this._apiFetch(url, keychain.token, {
				method: 'PUT',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(payload)
			});

			return await res.json();
		},

		async deleteFile(filename, sha, workspace, keychain) {
			const fullPath = this._getFullPath(workspace.rootDir, filename);
			const { branch } = workspace;
			const url = this._repoUrl(workspace, `contents/${fullPath}`);

			const payload = { 
				message: `Delete note: ${filename}`, 
				sha: sha, 
				branch: branch 
			};

			// Note: _apiFetch explicitly ignores 404s on DELETE
			await this._apiFetch(url, keychain.token, {
				method: 'DELETE',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(payload)
			});
		},

		fileUploadSizeLimit() {
			return 10 * 1024 * 1024; // 10MB hard limit for GitHub Contents API
		}
	};

	return GitHubService;
});
//# sourceURL=src/remote/github.js
</script>
<script>
// remoteStorage provider (draft-dejong-remotestorage), strictly network
// operations. Works with any remoteStorage server: the workspace's `host` is
// the storage URL and the keychain holds a bearer token. No extensions are
// used, so a refresh walks the folders, skipping any whose ETag is unchanged.
define('remote/remotestorage', ['lib/net', 'lib/path', 'lib/fileTypes', 'lib/encoding'], (Net, Path, FileTypes, Encoding) => {
	// Folder listings seen this session, keyed by folder URL:
	// { etag, entries } where entries is the deep listing below that folder.
	const folderCache = new Map();

	const RemoteStorageService = {
		/* =====================================================================
		   AUXILIARY HELPERS
		===================================================================== */

		// The storage URL with exactly one trailing slash.
		_storageUrl(workspace) {
			const url = (workspace.host || '').trim().replace(/\/+$/, '');
			if (!/^https?:\/\//.test(url)) throw new Error('Set the storage URL (https://…/storage/) for this remoteStorage workspace.');
			return url + '/';
		},

		// Each path segment is encoded on its own, as in remote/github (C5).
		_encodePath(path) {
			return Path.cleanPath(path).split('/').filter(Boolean).map(encodeURIComponent).join('/');
		},

		_docUrl(workspace, filename) {
			const root = Path.cleanPath(workspace.rootDir);
			const full = root ? `${root}/${filename}` : filename;
			return this._storageUrl(workspace) + this._encodePath(full);
		},

		_folderUrl(workspace, folder) {
			const encoded = this._encodePath(folder);
			return this._storageUrl(workspace) + (encoded ? encoded + '/' : '');
		},

		// Strong or weak, quoted or not: the bare version string.
		_etag(res) {
			const raw = res.headers.get('ETag');
			return raw ? raw.replace(/^W\//, '').replace(/^"|"$/g, '') : null;
		},

		// remoteStorage defines status codes but not error bodies, so the message
		// comes from the status; a server's own message is appended when present.
		async _error(res) {
			const body = await res.json().catch(() => ({}));
			const detail = body && body.message ? ` (${body.message})` : '';
			const messages = {
				401: 'remoteStorage rejected the token. Check the keychain.',
				403: 'Access denied by the remoteStorage server.',
				404: 'Not found on the remoteStorage server.',
				409: 'Path conflict: a folder name clashes with a file on the server.',
				412: 'Conflict: Remote has newer changes. Please Pull first.',
				413: 'File too large for the remoteStorage server.',
				429: 'Too many requests. Try again in a minute.',
				507: 'The remoteStorage account is over its quota.',
			};
			return new Error((messages[res.status] || `remoteStorage error: ${res.status}`) + detail);
		},

		_fetch(url, keychain, options = {}) {
			if (!keychain || !keychain.token) throw new Error('Missing token in keychain.');
			return Net.fetchWithTimeout(url, {
				...options,
				headers: { 'Authorization': `Bearer ${keychain.token}`, ...options.headers },
				cache: 'no-store',
			});
		},

		/* =====================================================================
		   TREE OPERATIONS
		===================================================================== */

		// One folder listing, revalidated with If-None-Match when we have seen it.
		// Returns { etag, items, cached } where cached means the server said 304.
		async _listFolder(url, keychain) {
			const known = folderCache.get(url);
			const headers = known && known.etag ? { 'If-None-Match': `"${known.etag}"` } : {};
			const res = await this._fetch(url, keychain, { headers });
			if (res.status === 304 && known) return { ...known, cached: true };
			if (res.status === 404) return { etag: null, items: {}, cached: false };   // empty folders are often 404
			if (!res.ok) throw await this._error(res);
			const body = await res.json();
			return { etag: this._etag(res), items: (body && body.items) || {}, cached: false };
		},

		// The deep listing below a folder, relative to it. A subfolder whose ETag
		// in the parent listing equals the one we cached is reused without a request.
		async _walk(url, keychain, knownEtag) {
			const known = folderCache.get(url);
			if (known && knownEtag && known.etag === knownEtag) return known.entries;

			const listing = await this._listFolder(url, keychain);
			if (listing.cached) return listing.entries;

			const entries = [];
			for (const [name, item] of Object.entries(listing.items)) {
				if (name.endsWith('/')) {
					const sub = name.slice(0, -1);
					const below = await this._walk(url + encodeURIComponent(sub) + '/', keychain, item.ETag);
					for (const e of below) entries.push({ ...e, path: `${sub}/${e.path}` });
				} else {
					entries.push({ path: name, sha: item.ETag, type: 'blob', size: item['Content-Length'] || 0 });
				}
			}
			folderCache.set(url, { etag: listing.etag, items: listing.items, entries });
			return entries;
		},

		async getTree(workspace, keychain) {
			const url = this._folderUrl(workspace, workspace.rootDir);

			if (workspace.shallow) {
				const listing = await this._listFolder(url, keychain);
				const tree = Object.entries(listing.items).map(([name, item]) => name.endsWith('/')
					? { path: name.slice(0, -1), sha: item.ETag, type: 'folder', size: 0 }
					: { path: name, sha: item.ETag, type: 'blob', size: item['Content-Length'] || 0 });
				return { tree, truncated: false };
			}

			return { tree: await this._walk(url, keychain, null), truncated: false };
		},

		/* =====================================================================
		   FILE OPERATIONS
		===================================================================== */

		async getFile(filename, workspace, keychain) {
			const res = await this._fetch(this._docUrl(workspace, filename), keychain);
			if (!res.ok) throw await this._error(res);

			if (!FileTypes.isTextFile(filename)) {
				const rawBlob = await res.blob();
				return { content: new Blob([rawBlob], { type: FileTypes.mimeTypeFor(filename) }), sha: this._etag(res) };
			}
			return { content: Encoding.utoa(await res.text()), sha: this._etag(res) };
		},

		async putFile(filename, base64Content, sha, commitMsg, workspace, keychain) {
			const binaryString = atob(base64Content);
			const bytes = new Uint8Array(binaryString.length);
			for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);

			// Always conditional: update only the version we last saw, or create only if absent.
			const res = await this._fetch(this._docUrl(workspace, filename), keychain, {
				method: 'PUT',
				headers: {
					'Content-Type': FileTypes.isTextFile(filename) ? 'text/plain; charset=utf-8' : FileTypes.mimeTypeFor(filename),
					...(sha ? { 'If-Match': `"${sha}"` } : { 'If-None-Match': '*' }),
				},
				body: bytes,
			});
			if (!res.ok) throw await this._error(res);

			const newSha = this._etag(res);
			if (!newSha) throw new Error('The server did not return an ETag. Check that its CORS settings expose ETag.');
			return { content: { sha: newSha } };
		},

		async deleteFile(filename, sha, workspace, keychain) {
			const res = await this._fetch(this._docUrl(workspace, filename), keychain, {
				method: 'DELETE',
				headers: sha ? { 'If-Match': `"${sha}"` } : {},
			});
			if (!res.ok && res.status !== 404) throw await this._error(res);
		},

		fileUploadSizeLimit() {
			return 100 * 1024 * 1024; // remoteStorage has no way to ask; servers answer 413 above their limit
		},

		// For tests: forget the folder listings seen so far.
		_resetCache() { folderCache.clear(); },
	};

	return RemoteStorageService;
});
//# sourceURL=src/remote/remotestorage.js
</script>
<script>
// Facade over the provider of the active workspace's keychain.
//
// The provider contract. Each file has one version id ("sha": GitHub's git
// blob sha, Dropbox's rev, remoteStorage's ETag), and the same id appears in
// every call below, so the app only ever compares ids:
//
//   getTree(ws, kc)       -> { tree: [{ path, type: 'blob' | 'folder', sha, size }], truncated }
//                            Paths are relative to ws.rootDir. A shallow listing (ws.shallow)
//                            covers the top level only; truncated means entries are missing.
//   getFile(name, ws, kc) -> { content, sha }: base64 text, or a Blob for non-text files
//                            (FileTypes.isTextFile). sha identifies exactly these bytes;
//                            null only if the provider can't tell.
//   putFile(name, base64, sha, msg, ws, kc) -> { content: { sha } }, the new id.
//                            Conditional: replaces version sha, and fails if the remote
//                            has moved on; a null sha creates, and fails if the file
//                            exists. msg is a commit message, if any.
//   deleteFile(name, sha, ws, kc)
//                            Conditional on sha in the same way.
//                            A file already gone counts as deleted.
//   fileUploadSizeLimit() -> bytes
define('remote/sync', ['model/config', 'remote/github', 'remote/dropbox', 'remote/remotestorage'], (Config, GitHub, Dropbox, RemoteStorage) => {
	const providers = { github: GitHub, dropbox: Dropbox, remotestorage: RemoteStorage };

	const SyncService = {
		get active() {
			const ws = Config.activeWorkspace;
			const kc = Config.activeKeychain;
			if (!ws || !kc) throw new Error("Active workspace is missing a linked keychain.");
			return providers[kc.provider] || GitHub;
		},
		getTree: () => SyncService.active.getTree(Config.activeWorkspace, Config.activeKeychain),
		getFile: (filename) => SyncService.active.getFile(filename, Config.activeWorkspace, Config.activeKeychain),
		putFile: (filename, content, sha, commitMsg) => SyncService.active.putFile(filename, content, sha, commitMsg, Config.activeWorkspace, Config.activeKeychain),
		deleteFile: (filename, sha) => SyncService.active.deleteFile(filename, sha, Config.activeWorkspace, Config.activeKeychain),
		fileUploadSizeLimit: () => SyncService.active.fileUploadSizeLimit(),
	};

	return SyncService;
});
//# sourceURL=src/remote/sync.js
</script>
<script>
// Local note cache: one IndexedDB database per workspace (workspace.dbName),
// holding one record per file: { filename, content, last_synced_sha, remote_sha, is_dirty, is_folder }.
define('storage/notesDb', ['model/config'], (Config) => {
	const DBService = {
		storeName: 'notes',

		// Cache of open IDBDatabase promises keyed by db name.
		// Reusing a single connection per database is the correct IDB pattern —
		// calling indexedDB.open() on every operation creates unnecessary overhead.
		_dbCache: {},

		// Ceiling for any single local IndexedDB operation — opening the
		// connection, or a get/put/delete/etc request within it.
		//
		// Unlike fetch()'s AbortController, an IDBRequest has no abort()/cancel();
		// a "timeout" here can't literally cancel the underlying browser-internal
		// request. What it CAN do is stop the app from awaiting it forever,
		// surface a clear error instead of a silent hang, and evict the cached
		// connection so the next attempt opens a fresh one instead of re-awaiting
		// a request that may never settle. This matters because Chrome on Android
		// has a known behavior where a backgrounded/frozen PWA can leave an
		// in-flight IndexedDB request permanently pending after the page resumes
		// — and since _dbCache reuses one Promise per db name, a single wedged
		// open() previously poisoned every future read/write for that workspace
		// until a full reload.
		DB_TIMEOUT_MS: 8000,

		// Races `promise` against a timer. Whichever settles first wins; the
		// loser is left to resolve/reject into the void (IDB gives us no way to
		// actually cancel it).
		_guardWithTimeout(promise, label) {
			let timer;
			const timeout = new Promise((_, reject) => {
				timer = setTimeout(() => {
					reject(new Error(`${label} timed out. If this keeps happening, try reloading the app.`));
				}, this.DB_TIMEOUT_MS);
			});
			return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
		},

		// Dynamically read the database name for the active profile
		get dbName() {
			const ws = Config.activeWorkspace;
			if (!ws) {
				throw new Error("No active profile. Database locked.");
			}
			return ws.dbName;
		},

		// Listeners for onWrite(), called after every put, delete and clear.
		_writeListeners: new Set(),

		// Calls cb({ dbName, filename }) after each successful write in this tab
		// (filename is null after clear). Returns an unsubscribe function.
		// Other tabs learn of writes through app/crossTab.
		onWrite(cb) {
			this._writeListeners.add(cb);
			return () => this._writeListeners.delete(cb);
		},

		_written(dbName, filename) {
			for (const cb of [...this._writeListeners]) {
				try { cb({ dbName, filename }); } catch (err) { console.error(err); }
			}
		},

		// Every operation below takes an optional `dbName`, for callers that must
		// keep writing to the workspace they started in after the user switches
		// away (a delayed autosave, a push or pull still waiting on the network).
		init(name = this.dbName) {
			if (this._dbCache[name]) return this._dbCache[name];

			const openPromise = new Promise((resolve, reject) => {
				const request = indexedDB.open(name, 1);
				request.onupgradeneeded = (e) => {
					const db = e.target.result;
					if (!db.objectStoreNames.contains(this.storeName)) {
						db.createObjectStore(this.storeName, { keyPath: 'filename' });
					}
				};
				request.onsuccess = () => {
					const db = request.result;
					// If another context deletes this database (e.g. deleteWorkspace),
					// close the connection and evict the cache so the next init()
					// opens a fresh handle rather than using a stale one.
					db.onversionchange = () => {
						db.close();
						delete this._dbCache[name];
					};
					resolve(db);
				};
				request.onerror = () => reject(request.error);
			});

			const guarded = this._guardWithTimeout(openPromise, `Opening local database`);

			// On timeout OR a native open() error, evict the cache entry so the
			// next init() call starts a fresh indexedDB.open() rather than
			// re-awaiting this same (possibly forever-pending) request. Guard
			// against a race with a later attempt already having replaced us.
			guarded.catch(() => {
				if (this._dbCache[name] === guarded) delete this._dbCache[name];
			});

			this._dbCache[name] = guarded;
			return guarded;
		},

		// Runs a single IDB operation against the open db handle, under the same
		// timeout guard as init(). On failure, evicts the cached connection too —
		// a wedged transaction is a strong signal the connection itself is dead,
		// so the best recovery is a fresh indexedDB.open() on the next call.
		async _run(executor, label, name = this.dbName) {
			const db = await this.init(name);
			try {
				return await this._guardWithTimeout(executor(db), label);
			} catch (err) {
				delete this._dbCache[name];
				throw err;
			}
		},

		async put(note, dbName = this.dbName) {
			await this._run(db => new Promise((resolve, reject) => {
				const tx = db.transaction(this.storeName, 'readwrite');
				tx.objectStore(this.storeName).put(note);
				tx.oncomplete = () => resolve();
				tx.onerror = () => reject(tx.error);
				tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
			}), 'Saving note', dbName);
			this._written(dbName, note.filename);
		},
		// Reads every note and applies what plan(notes) returns, { put: [notes],
		// delete: [filenames] }, in the same readwrite transaction, so no other
		// write lands in between. plan must be synchronous. Returns its result.
		async rewriteAll(plan, dbName = this.dbName) {
			let changes = {};
			await this._run(db => new Promise((resolve, reject) => {
				const tx = db.transaction(this.storeName, 'readwrite');
				const store = tx.objectStore(this.storeName);
				const request = store.getAll();
				request.onsuccess = () => {
					try {
						changes = plan(request.result) || {};
					} catch (err) {
						tx.abort();
						return reject(err);
					}
					for (const note of changes.put || []) store.put(note);
					for (const filename of changes.delete || []) store.delete(filename);
				};
				tx.oncomplete = () => resolve();
				tx.onerror = () => reject(tx.error);
				tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
			}), 'Updating notes', dbName);
			for (const note of changes.put || []) this._written(dbName, note.filename);
			for (const filename of changes.delete || []) this._written(dbName, filename);
			return changes;
		},
		async get(filename, dbName) {
			return this._run(db => new Promise((resolve, reject) => {
				const tx = db.transaction(this.storeName, 'readonly');
				const request = tx.objectStore(this.storeName).get(filename);
				request.onsuccess = () => resolve(request.result);
				request.onerror = () => reject(request.error);
			}), 'Reading note', dbName);
		},
		async getAll() {
			return this._run(db => new Promise((resolve, reject) => {
				const tx = db.transaction(this.storeName, 'readonly');
				const request = tx.objectStore(this.storeName).getAll();
				request.onsuccess = () => resolve(request.result);
				request.onerror = () => reject(request.error);
			}), 'Reading notes');
		},
		async delete(filename) {
			const dbName = this.dbName;
			await this._run(db => new Promise((resolve, reject) => {
				const tx = db.transaction(this.storeName, 'readwrite');
				tx.objectStore(this.storeName).delete(filename);
				tx.oncomplete = () => resolve();
				tx.onerror = () => reject(tx.error);
				tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
			}), 'Deleting note', dbName);
			this._written(dbName, filename);
		},
		async getAllKeys() {
			return this._run(db => new Promise((resolve, reject) => {
				const tx = db.transaction(this.storeName, 'readonly');
				const request = tx.objectStore(this.storeName).getAllKeys();
				request.onsuccess = () => resolve(request.result);
				request.onerror = () => reject(request.error);
			}), 'Reading note list');
		},
		async clear() {
			const dbName = this.dbName;
			await this._run(db => new Promise((resolve, reject) => {
				const tx = db.transaction(this.storeName, 'readwrite');
				tx.objectStore(this.storeName).clear();
				tx.oncomplete = () => resolve();
				tx.onerror = () => reject(tx.error);
				tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
			}), 'Clearing local cache', dbName);
			this._written(dbName, null);
		}
	};

	return DBService;
});
//# sourceURL=src/storage/notesDb.js
</script>
<script>
// The editor area: mounts the plugin for the open file into the view/edit
// layers, switches between view and edit mode, and shows the file chrome
// (export/pull/push/delete buttons).
define('ui/editor', ['ui/refs', 'ui/sidebar', 'ui/status', 'plugins/registry'], (DOM, Sidebar, Status, Plugins) => {
	let currentFilename = null;
	// The view/edit choice carries over from file to file. A plugin with a
	// preferredMode overrides it for its own file only, in modeOverride.
	let isViewMode = false;
	let modeOverride = null;
	const viewMode = () => modeOverride ?? isViewMode;
	let activePlugin = null;
	// The open plugin's host (see actions/host), disposed with the plugin.
	let activeHost = null;
	let isFrozen = false;
	let handlers = { onEdit() {}, onLeave() {}, makeHost: () => null };

	const setLayerVisible = (layer, isVisible) => {
		layer.style.display = 'block';
		layer.style.visibility = isVisible ? 'visible' : 'hidden';
		layer.style.opacity = isVisible ? '1' : '0';
		layer.style.pointerEvents = isVisible ? 'auto' : 'none';
	};

	// Toggles the editor chrome buttons (save/pull/push/delete) as a unit.
	// Both reset and activate maintain this set — a helper
	// ensures they stay in sync with no risk of one growing out of step.
	const setEditorChrome = (isOpen) => {
		const display = isOpen ? 'block' : 'none';
		DOM.saveBtn.style.display = display;
		DOM.pullBtn.style.display = display;
		DOM.pushBtn.style.display = display;
		DOM.deleteBtn.style.display = display;
	};

	const unmountPlugin = () => {
		if (activeHost) {
			activeHost.dispose();
			activeHost = null;
		}
		if (activePlugin && activePlugin.unmount) {
			activePlugin.unmount();
			activePlugin = null;
		}
	};

	const Editor = {
		// handlers: { onEdit(newContent), onLeave(), makeHost(filename) }.
		// onLeave runs whenever the open file is about to be replaced or closed,
		// so pending edits get saved. makeHost returns the plugin's host, with
		// an `api` for the plugin and `dispose()`.
		bind(h) { handlers = { ...handlers, ...h }; },

		currentFilename: () => currentFilename,
		activePlugin: () => activePlugin,
		setLayerVisible,

		// Closes the open file and hides every layer.
		reset() {
			handlers.onLeave();
			isViewMode = false;
			modeOverride = null;
			currentFilename = null;
			document.title = 'gh-memo';

			// 1. Unmount any active plugin to free memory
			unmountPlugin();

			// 2. Clear and reset the agnostic layers
			DOM.editLayer.replaceChildren();
			DOM.viewLayer.replaceChildren();
			setLayerVisible(DOM.editLayer, false);
			setLayerVisible(DOM.viewLayer, false);

			DOM.filenameLabel.textContent = 'No file selected';
			setEditorChrome(false);
			Status.hide();
			DOM.viewToggle.style.display = 'none';
			if (DOM.settingsPanel) DOM.settingsPanel.style.display = 'none';
		},

		// Opens `filename` with `content` in the matching plugin.
		async activate(filename, content) {
			handlers.onLeave();
			currentFilename = filename;
			DOM.filenameLabel.textContent = filename;
			document.title = filename;
			Status.hide();

			// Reset any previous cross-tab freezes
			isFrozen = false;
			DOM.pullBtn.disabled = false;
			DOM.pushBtn.disabled = false;
			DOM.editLayer.style.opacity = '1';
			DOM.editLayer.style.pointerEvents = 'auto';

			if (DOM.settingsPanel) DOM.settingsPanel.style.display = 'none';

			// 1. UNMOUNT
			unmountPlugin();

			// 2. NEGOTIATE & INSTANTIATE
			const plugin = Plugins.find(filename).create();
			// Note: activePlugin is set AFTER a successful mount. If mount() throws, the
			// previous plugin has already been unmounted but we avoid leaving activePlugin
			// pointing to a half-initialised instance.

			modeOverride = plugin.preferredMode ? plugin.preferredMode === 'view' : null;
			if (modeOverride === null) {
				if (!plugin.supportedModes.includes('edit') && !isViewMode) isViewMode = true;
				else if (!plugin.supportedModes.includes('view') && isViewMode) isViewMode = false;
			}

			// 3. PREPARE CHROME
			setEditorChrome(true);
			DOM.viewLayer.replaceChildren();
			DOM.editLayer.replaceChildren();

			// 4. PROVIDE SAVE HOOK AND HOST
			const host = handlers.makeHost(filename);
			activeHost = host;
			const saveCallback = (newContent) => handlers.onEdit(newContent);

			// 5. MOUNT
			await plugin.mount(filename, content, DOM.viewLayer, DOM.editLayer, saveCallback, { isViewMode: viewMode(), host: host ? host.api : null });
			activePlugin = plugin;

			Editor.applyModeVisibility();

			// On mobile the sidebar is a full-screen overlay. Close it automatically
			// when a file is opened so the editor is immediately visible without a
			// manual tap on the toggle strip.
			if (window.innerWidth <= 768 && !Sidebar.isCollapsed()) {
				Sidebar.toggle();
			}
		},

		applyModeVisibility() {
			const plugin = activePlugin;

			if (plugin.supportedModes.includes('view') && plugin.supportedModes.includes('edit')) {
				DOM.viewToggle.style.display = 'flex';
				DOM.viewToggle.textContent = viewMode() ? '✏️' : '👁️';
			} else {
				DOM.viewToggle.style.display = 'none';
			}

			if (viewMode()) {
				setLayerVisible(DOM.editLayer, false);
				setLayerVisible(DOM.viewLayer, true);
			} else {
				setLayerVisible(DOM.editLayer, true);
				setLayerVisible(DOM.viewLayer, false);
			}
		},

		async toggleViewMode() {
			const plugin = activePlugin;
			if (!plugin || !plugin.supportedModes.includes('view') || !plugin.supportedModes.includes('edit')) return;

			if (modeOverride === null) isViewMode = !isViewMode;
			else modeOverride = !modeOverride;
			Editor.applyModeVisibility();

			if (plugin.onModeSwitch) await plugin.onModeSwitch(viewMode());
		},

		// Locks the editor because the open file was edited in another tab.
		// Returns false if it was already frozen.
		freeze() {
			if (isFrozen) return false;
			isFrozen = true;

			// 1. Core locks global Chrome
			DOM.pullBtn.disabled = true;
			DOM.pushBtn.disabled = true;
			DOM.editLayer.style.opacity = '0.6';

			// 2. Plugin locks its specific inputs
			if (activePlugin && activePlugin.freeze) {
				activePlugin.freeze();
			} else {
				// Brutal fallback if a plugin forgets to implement freeze()
				DOM.editLayer.style.pointerEvents = 'none';
			}
			return true;
		},
	};

	return Editor;
});

<script>
// The sidebar file list, including virtual mount folders, the "../" entry
// and search (filename filter, or content search with match counts).
define('ui/fileList', ['ui/refs', 'ui/editor', 'lib/dom', 'storage/notesDb', 'model/forest'], (DOM, Editor, Dom, DBService, Forest) => {
	const { h } = Dom;
	let handlers = { open() {}, goUp() {} };
	let renderId = 0;

	// Derives the status icon for a file-list entry purely from its note state.
	const getFileIcon = (note) => {
		const isDirty = note.is_dirty;
		const localOnly = !note.remote_sha
		const hasRemoteUpdate = note.remote_sha && note.remote_sha !== note.last_synced_sha;
		if (note.is_folder) return note.is_mount_point ? '🗂️' : '📁';
		/* if (note.filename.endsWith('.symlink')) return '🔗'; */
		if (isDirty && hasRemoteUpdate) return '🟡⬇️';
		if (localOnly) return '';
		if (isDirty) return '🟡';
		if (hasRemoteUpdate) return '⬇️';
		return '🟢';
	};

	// Appends a trailing slash to folder entries so the type is visually unambiguous.
	const getDisplayName = (note) => note.is_folder ? note.filename + '/' : note.filename;

	// Filters and orders notes for display. Pure: mutates only note.matchCount.
	const filterNotes = (notes, searchTerm, deepSearch) => {
		const term = searchTerm.toLowerCase();

		if (term) {
			if (deepSearch) {
				notes.forEach(note => {
					// Guard against binary blobs
					if (typeof note.content === 'string') {
						const content = note.content.toLowerCase();
						note.matchCount = content.split(term).length - 1;
					} else {
						note.matchCount = 0;
					}
				});
				notes = notes.filter(n => n.matchCount > 0 || n.filename.toLowerCase().includes(term));
				notes.sort((a, b) => (b.matchCount || 0) - (a.matchCount || 0));
			} else {
				notes = notes.filter(n => n.filename.toLowerCase().includes(term));
			}
		} else {
			notes.sort((a, b) => a.filename.localeCompare(b.filename));
		}
		return notes;
	};

	return {
		// handlers: { open(filename), goUp(workspaceId) }
		bind(hs) { handlers = hs; },

		getFileIcon,
		filterNotes,

		async render(searchTerm = '', deepSearch = false) {
			// 1. Grab a ticket for this specific render request
			const currentRenderId = ++renderId;

			let notes = await DBService.getAll();

			// --- VIRTUAL MOUNT POINT INJECTION ---
			const virtualMounts = Forest.getVirtualMounts();
			virtualMounts.forEach(relativePath => {
				if (!notes.find(n => n.filename === relativePath)) {
					notes.push({ filename: relativePath, is_folder: true, is_mount_point: true, is_dirty: false, matchCount: 0 });
				} else {
					notes.find(n => n.filename === relativePath).is_mount_point = true;
				}
			});
			// -------------------------------------

			// 2. If another search started while we were waiting for the DB, abort this one!
			if (currentRenderId !== renderId) return;

			DOM.fileList.replaceChildren();
			notes = filterNotes(notes, searchTerm, deepSearch);

			// --- PARENT WORKSPACE NAVIGATION BUTTON ---
			// Only show the "Go Up" button if we are not currently searching
			if (!searchTerm) {
				const parentId = Forest.getParentWorkspace();
				if (parentId) {
					const li = h('li', {
						class: 'file-item parent-nav',
						onclick: () => handlers.goUp(parentId)
					}, h('span', {}, '🔙 ../'));

					DOM.fileList.appendChild(li);
				}
			}
			// ------------------------------------------

			notes.forEach(note => {
				const li = h('li', {
					class: 'file-item' + (note.filename === Editor.currentFilename() ? ' active' : ''),
					onclick: () => handlers.open(note.filename)
				}, h('span', {}, getFileIcon(note) + ' ' + getDisplayName(note)));

				if (deepSearch && note.matchCount) {
					li.appendChild(h('span', { class: 'match-count' }, note.matchCount + ' match' + (note.matchCount > 1 ? 'es' : '')));
				}

				DOM.fileList.appendChild(li);
			});
		},
	};
});
//# sourceURL=src/ui/fileList.js
</script>

<script>
// References to the fixed elements of index.html, filled in by init() once the DOM exists.
define('ui/refs', [], () => {
	const DOM = {
		init() {
			DOM.sidebar = document.getElementById('sidebar');
			DOM.fileInput = document.getElementById('file-upload');
			DOM.pinContainer = document.getElementById('pin-container');
			DOM.searchBar = document.getElementById('search-bar');
			DOM.fileList = document.getElementById('file-list');
			DOM.viewLayer = document.getElementById('view-layer');
			DOM.editLayer = document.getElementById('edit-layer');
			DOM.filenameLabel = document.getElementById('current-filename');
			DOM.saveBtn = document.getElementById('save-btn');
			DOM.pullBtn = document.getElementById('pull-btn');
			DOM.pushBtn = document.getElementById('push-btn');
			DOM.deleteBtn = document.getElementById('delete-btn');
			DOM.statusBar = document.getElementById('status-bar');
			DOM.viewToggle = document.getElementById('view-toggle');
			DOM.settingsPanel = document.getElementById('settings-panel');
			DOM.workspaceIndicator = document.getElementById('workspace-indicator');
		},
	};
	return DOM;
});
//# sourceURL=src/ui/refs.js
</script>
<script>
// The settings screen: keychains (credentials) and the workspace forest
// (one group per origin tree, one row per mount point). Inputs edit the
// in-memory config directly as you type; every committed change (the
// 'change' event: blur, Enter, a checkbox or select) persists it through
// handlers.save() and briefly shows "Saved ✓".
define('ui/settings', ['ui/refs', 'ui/status', 'lib/dom', 'model/config', 'model/forest', 'buildInfo'], (DOM, Status, Dom, Config, Forest, BuildInfo) => {
	const { h } = Dom;
	let handlers = {};
	let savedTimer = null;

	const flashSaved = () => {
		const el = DOM.settingsPanel.querySelector('.settings-saved');
		if (!el) return;
		el.style.visibility = 'visible';
		clearTimeout(savedTimer);
		savedTimer = setTimeout(() => el.style.visibility = 'hidden', 1500);
	};

	// The async Clipboard API needs a secure context (https or localhost), so
	// file:// falls back to selecting the field and execCommand('copy').
	const copyText = async (text) => {
		if (!navigator.clipboard || !window.isSecureContext) return false;
		await navigator.clipboard.writeText(text);
		return true;
	};
	const copyBySelection = (input) => {
		const type = input.type;
		input.type = 'text';
		input.select();
		let copied = false;
		try { copied = document.execCommand('copy'); } catch (err) { copied = false; }
		input.type = type;
		input.setSelectionRange(0, 0);
		input.blur();
		return copied;
	};

	const createKeychainCard = (id, kc, template) => {
		const clone = template.content.cloneNode(true);
		const card = clone.querySelector('.profile-card');

		card.querySelector('.kc-title').textContent = kc.name;

		const providerEl = card.querySelector('.kc-provider');
		const tokenEl = card.querySelector('.kc-token');
		const appKeyEl = card.querySelector('.kc-appkey');

		providerEl.value = kc.provider || 'github';
		tokenEl.value = kc.token || '';
		appKeyEl.value = kc.appKey || '';

		providerEl.addEventListener('change', e => kc.provider = e.target.value);
		tokenEl.addEventListener('input', e => kc.token = e.target.value);
		appKeyEl.addEventListener('input', e => kc.appKey = e.target.value);

		// Show/hide and copy for the PAT. The status bar never shows the value.
		const btnToggleToken = card.querySelector('.btn-token-toggle');
		btnToggleToken.addEventListener('click', () => {
			const hidden = tokenEl.type === 'password';
			tokenEl.type = hidden ? 'text' : 'password';
			btnToggleToken.textContent = hidden ? 'Hide' : 'Show';
		});
		card.querySelector('.btn-token-copy').addEventListener('click', async () => {
			if (!tokenEl.value) return Status.show('No token to copy.', true);
			const copied = await copyText(tokenEl.value).catch(() => false) || copyBySelection(tokenEl);
			Status.show(copied ? 'Token copied.' : 'Copy failed: select the token and copy it by hand.', !copied);
		});

		// GitHub and remoteStorage both use a pasted token; only the wording differs.
		const tokenLabelEl = card.querySelector('.kc-token-label');
		const toggleVisibility = () => {
			const isDbx = providerEl.value === 'dropbox';
			const isRs = providerEl.value === 'remotestorage';
			card.querySelectorAll('.dbx-only').forEach(el => el.style.display = isDbx ? 'flex' : 'none');
			card.querySelectorAll('.gh-only').forEach(el => el.style.display = isDbx ? 'none' : 'flex');
			tokenLabelEl.textContent = isRs ? 'Bearer Token' : 'Personal Access Token';
			tokenEl.placeholder = isRs ? 'token from the server' : 'ghp_...';
		};
		providerEl.addEventListener('change', toggleVisibility);
		toggleVisibility();

		const dbxStatusEl = card.querySelector('.dbx-status');
		const btnLinkDbx = card.querySelector('.btn-link-dbx');

		if (dbxStatusEl) {
			dbxStatusEl.textContent = kc.refreshToken ? '✅ Linked (Auto-refresh active)' : '❌ Not linked';
			dbxStatusEl.style.color = kc.refreshToken ? 'var(--success, green)' : 'var(--danger, red)';
		}

		if (btnLinkDbx) {
			btnLinkDbx.style.display = kc.refreshToken ? 'none' : 'block';
			btnLinkDbx.addEventListener('click', () => {
				handlers.save();
				handlers.linkDropbox(id);
			});
		}

		appKeyEl.addEventListener('input', () => {
			if (btnLinkDbx && kc.refreshToken) {
				dbxStatusEl.textContent = '⚠️ App Key changed. Re-link required.';
				dbxStatusEl.style.color = '#c98200';
				btnLinkDbx.style.display = 'block';
			}
		});

		card.querySelector('.btn-delete').addEventListener('click', () => handlers.deleteKeychain(id));
		return card;
	};

	const createTreeGroup = (sig, wsIds, treeTemplate, rowTemplate) => {
		const refWs = Config.workspaces[wsIds[0]];

		const clone = treeTemplate.content.cloneNode(true);
		const groupEl = clone.querySelector('.tree-group');
		const listEl = groupEl.querySelector('.mount-list');
		const titleEl = groupEl.querySelector('.tree-title');

		// Set dynamic title
		const rsTitle = (host) => `🗃️ remoteStorage ${host || '(No Storage URL)'}`;
		if (sig.startsWith('github|')) {
		    titleEl.textContent = `🐙 ${refWs.owner || '(No Owner)'} / ${refWs.repo || '(No Repo)'}`;
		} else if (sig.startsWith('remotestorage|')) {
		    titleEl.textContent = rsTitle(refWs.host);
		} else {
		    titleEl.textContent = `🗄️ Dropbox Storage`;
		}

		// Bind Shared Inputs
		const selectKc = groupEl.querySelector('.tree-keychain');
		const ownerEl = groupEl.querySelector('.tree-owner');
		const repoEl = groupEl.querySelector('.tree-repo');
		const branchEl = groupEl.querySelector('.tree-branch');
		const hostEl = groupEl.querySelector('.tree-host');
		const commitToggle = groupEl.querySelector('.tree-askCommit');
		const ghContainer = groupEl.querySelector('.tree-gh-only');

		// Populate Keychains Dropdown
		for (const [kcId, keychain] of Object.entries(Config.keychains)) {
			selectKc.appendChild(h('option', { value: kcId }, `${keychain.name} (${keychain.provider})`));
		}
		selectKc.value = refWs.keychainId || '';

		// Visibility Toggle: Dropbox needs no origin fields, remoteStorage only the storage URL
		const providerOf = () => {
			const selectedKcId = selectKc.value;
			return selectedKcId && Config.keychains[selectedKcId]
				? Config.keychains[selectedKcId].provider : 'github';
		};
		const toggleGhVisibility = () => {
			const provider = providerOf();
			const isRs = provider === 'remotestorage';
			ghContainer.style.display = (provider === 'dropbox') ? 'none' : 'flex';
			groupEl.querySelector('.tree-repo-fields').style.display = isRs ? 'none' : 'contents';
			groupEl.querySelector('.tree-commit-field').style.display = isRs ? 'none' : 'flex';
			hostEl.placeholder = isRs ? 'Storage URL (https://…/storage/)' : 'Host';
			hostEl.style.width = isRs ? '320px' : '150px';
		};
		toggleGhVisibility();

		// Setup Values
		ownerEl.value = refWs.owner || '';
		repoEl.value = refWs.repo || '';
		branchEl.value = refWs.branch || '';
		hostEl.value = refWs.host || '';
		commitToggle.checked = !!refWs.askForCommitMsg;

		// Bind Events (Propagate changes to ALL workspaces in this tree instantly)
		// updateTreeTitle is extracted because both ownerEl and repoEl need the same
		// template — inlining it in each handler caused the string to diverge over time.
		const updateTreeTitle = () => {
			titleEl.textContent = `🐙 ${ownerEl.value || '(No Owner)'} / ${repoEl.value || '(No Repo)'}`;
		};
		selectKc.addEventListener('change', e => {
			wsIds.forEach(id => Config.workspaces[id].keychainId = e.target.value);
			toggleGhVisibility();
		});
		ownerEl.addEventListener('input', e => {
			wsIds.forEach(id => Config.workspaces[id].owner = e.target.value);
			updateTreeTitle();
		});
		repoEl.addEventListener('input', e => {
			wsIds.forEach(id => Config.workspaces[id].repo = e.target.value);
			updateTreeTitle();
		});
		branchEl.addEventListener('input', e => wsIds.forEach(id => Config.workspaces[id].branch = e.target.value));
		hostEl.addEventListener('input', e => {
			wsIds.forEach(id => Config.workspaces[id].host = e.target.value);
			if (providerOf() === 'remotestorage') titleEl.textContent = rsTitle(e.target.value);
		});
		commitToggle.addEventListener('change', e => wsIds.forEach(id => Config.workspaces[id].askForCommitMsg = e.target.checked));

		// Origin edits change the tree signature, which keys the tree's pins.
		let treeSig = sig;
		groupEl.addEventListener('change', () => {
			const newSig = Forest.computeTreeSig(refWs, Config.keychains[refWs.keychainId]);
			if (newSig === treeSig) return;
			handlers.rekeyPins(treeSig, newSig);
			treeSig = newSig;
		});

		// Mount Point Spawner
		groupEl.querySelector('.btn-add-mount').addEventListener('click', () => handlers.createMountPoint(refWs));

		// Render the child rows
		for (const id of wsIds) {
			const ws = Config.workspaces[id];
			const isActive = id === Config.activeWorkspaceId;
			listEl.appendChild(createMountRow(id, ws, isActive, rowTemplate));
		}

		return groupEl;
	};

	const createMountRow = (id, ws, isActive, rowTemplate) => {
		const rowClone = rowTemplate.content.cloneNode(true);
		const rowEl = rowClone.querySelector('.mount-row');

		if (isActive) rowEl.classList.add('active');

		const nameEl = rowEl.querySelector('.ws-name');
		const rootEl = rowEl.querySelector('.ws-rootDir');
		const shallowEl = rowEl.querySelector('.ws-shallow');
		const warningEl = rowEl.querySelector('.leaf-warning');

		nameEl.value = ws.name;
		nameEl.addEventListener('input', e => ws.name = e.target.value);

		rootEl.value = ws.rootDir || '';
		rootEl.addEventListener('input', e => ws.rootDir = e.target.value);

		// Leaf constraint: actions/settings keeps ws.shallow set while a mount
		// is below; the row only shows that it can't be unticked.
		shallowEl.checked = !!ws.shallow;
		if (Forest.hasMountsBelow(id)) {
			shallowEl.disabled = true;
			warningEl.style.display = 'inline';
		} else {
			shallowEl.addEventListener('change', e => ws.shallow = e.target.checked);
		}

		const btnSwitch = rowEl.querySelector('.btn-switch');
		if (isActive) {
			btnSwitch.textContent = 'Active';
			btnSwitch.disabled = true;
			btnSwitch.style.background = 'var(--accent)';
			btnSwitch.style.color = 'white';
		} else {
			btnSwitch.addEventListener('click', () => handlers.switchWorkspace(id));
		}

		rowEl.querySelector('.btn-clear').addEventListener('click', () => handlers.clearDB(id));
		rowEl.querySelector('.btn-delete').addEventListener('click', () => handlers.deleteWorkspace(id));

		return rowEl;
	};

	return {
		// handlers: { save, createKeychain, deleteKeychain(id), linkDropbox(id),
		//   createWorkspace, createMountPoint(parentWs), switchWorkspace(id),
		//   clearDB(id), deleteWorkspace(id), isSymlinkEditMode(), setSymlinkEditMode(bool),
		//   rekeyPins(oldSig, newSig) }
		bind(hs) { handlers = hs; },

		render() {
			DOM.settingsPanel.replaceChildren();
			DOM.settingsPanel.onchange = () => {
				handlers.save();
				flashSaved();
			};

			// ==========================================
			// 0: GLOBAL OVERRIDES
			// ==========================================
			DOM.settingsPanel.appendChild(
				h('div', { class: 'settings-header', style: 'margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border);' },
					h('label', { class: 'symlink-mode-label' },
						h('input', {
						    type: 'checkbox',
						    ...(handlers.isSymlinkEditMode() ? { checked: true } : {}),
						    onchange: e => handlers.setSymlinkEditMode(e.target.checked)
						}),
						'Edit Symlink'
					),
					h('span', { class: 'settings-saved', style: 'visibility: hidden; color: var(--success, green); font-size: 13px;' }, 'Saved ✓')
				)
			);

			// ==========================================
			// 1: KEYCHAINS (CREDENTIALS)
			// ==========================================
			DOM.settingsPanel.appendChild(
				h('div', { class: 'settings-header' },
					h('h2', { style: 'margin: 0;' }, 'Keychains'),
					h('button', { onclick: () => handlers.createKeychain(), style: 'background: var(--accent); color: white; border: none;' }, '+ New Keychain')
				)
			);

			const kcTemplate = document.getElementById('keychain-card-template');
			for (const [id, kc] of Object.entries(Config.keychains)) {
				DOM.settingsPanel.appendChild(createKeychainCard(id, kc, kcTemplate));
			}

			// ==========================================
			// 2: WORKSPACES (THE FOREST)
			// ==========================================
			DOM.settingsPanel.appendChild(
				h('div', { class: 'settings-header', style: 'margin-top: 40px;' },
					h('h2', { style: 'margin: 0;' }, 'Workspaces'),
					h('button', { onclick: () => handlers.createWorkspace(), style: 'background: var(--accent); color: white; border: none;' }, '+ New Origin Tree')
				)
			);

			const treeTemplate = document.getElementById('tree-group-template');
			const rowTemplate = document.getElementById('mount-row-template');

			for (const [sig, wsIds] of Object.entries(Forest.workspaceTrees())) {
				DOM.settingsPanel.appendChild(createTreeGroup(sig, wsIds, treeTemplate, rowTemplate));
			}

			// If this doesn't match your last build, you're looking at a stale copy.
			DOM.settingsPanel.appendChild(
				h('div', { class: 'build-info', style: 'margin-top: 20px; font-size: 12px; color: #666; text-align: center;' }, BuildInfo.label)
			);
		},
	};
});
//# sourceURL=src/ui/settings.js
</script>
<script>
define('ui/sidebar', ['ui/refs'], (DOM) => ({
	toggle() {
		DOM.sidebar.classList.toggle('collapsed');
	},
	collapse() {
		DOM.sidebar.classList.add('collapsed');
	},
	isCollapsed() {
		return DOM.sidebar.classList.contains('collapsed');
	},
}));
//# sourceURL=src/ui/sidebar.js
</script>
<script>
// The status bar at the bottom of the editor.
define('ui/status', ['ui/refs', 'lib/dom'], (DOM, Dom) => {
	let statusTimerId = null;
	// A standing notice with a button ({ text, label, onClick }), e.g. a new
	// version waiting. Messages cover it for a while; hiding brings it back.
	let offer = null;

	const showOffer = () => {
		DOM.statusBar.replaceChildren(offer.text, Dom.h('button', { class: 'status-action', onclick: offer.onClick }, offer.label));
		DOM.statusBar.style.display = 'flex';
		DOM.statusBar.className = 'offer';
	};

	const Status = {
		show(text, isError = false) {
			// Cancel any in-flight auto-hide so a rapid second call cannot
			// cause the previous timer to dismiss the new message early.
			clearTimeout(statusTimerId);
			DOM.statusBar.textContent = text;
			DOM.statusBar.style.display = 'flex';
			DOM.statusBar.className = isError ? 'error' : '';
			if (!isError) {
				statusTimerId = setTimeout(() => Status.hide(), 4000);
			}
		},
		hide() {
			if (offer) return showOffer();
			DOM.statusBar.style.display = 'none';
		},

		// Shows a notice that stays until the page reloads.
		offer(text, label, onClick) {
			clearTimeout(statusTimerId);
			offer = { text, label, onClick };
			showOffer();
		},
	};

	return Status;
});
//# sourceURL=src/ui/status.js
</script>
