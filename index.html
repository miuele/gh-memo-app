// A minimal module registry. Every source file registers itself with
//
//     define('dir/name', ['dep/one', 'dep/two'], (One, Two) => { ...; return api; });
//
// Factories run lazily, the first time a module is required, with their
// dependencies passed in as arguments, so files can be concatenated in any
// order. Cycles and duplicate names fail loudly at load time.
//
// Factories must only build their object: no DOM or localStorage access at
// definition time. That keeps every module loadable under Node for tests.
const define = (() => {
	const factories = {};
	const cache = {};
	const loading = [];

	const require = (name) => {
		if (name in cache) return cache[name];
		const factory = factories[name];
		if (!factory) throw new Error(`Unknown module: ${name}`);
		if (loading.includes(name)) throw new Error(`Dependency cycle: ${[...loading, name].join(' -> ')}`);

		loading.push(name);
		try {
			return (cache[name] = factory.fn(...factory.deps.map(require)));
		} finally {
			loading.pop();
		}
	};

	const define = (name, deps, fn) => {
		if (factories[name]) throw new Error(`Duplicate module: ${name}`);
		factories[name] = { deps, fn };
	};

	define.require = require;
	define.names = () => Object.keys(factories);
	return define;
})();

<script>
// Local file operations: open (including mount and symlink redirection),
// create, upload, autosave, delete and export.
define('actions/files',
	['model/config', 'model/forest', 'model/symlink', 'model/target', 'storage/notesDb', 'remote/sync', 'lib/tabChannel', 'lib/fileTypes',
	 'ui/refs', 'ui/editor', 'ui/fileList', 'ui/sidebar', 'ui/status', 'actions/workspaces'],
	(Config, Forest, Symlink, Target, DBService, SyncService, Tabs, FileTypes,
	 DOM, Editor, FileList, Sidebar, Status, Workspaces) => {

	// The debounced autosave: { filename, dbName, content } waiting for typingTimer.
	let typingTimer = null;
	let pendingEdit = null;
	// Chain of autosave writes, so flushes complete in order.
	let writing = Promise.resolve();
	// When on, .symlink files open in the editor instead of being followed.
	let isSymlinkEditMode = false;

	// Saves one edit into the file and workspace it was typed in. A note that
	// is gone (deleted, cache cleared) is not recreated.
	const saveEdit = async ({ filename, dbName, content }) => {
		try {
			const note = await DBService.get(filename, dbName);
			if (!note || note.content === content) return;
			note.content = content;
			note.is_dirty = true;
			await DBService.put(note, dbName);

			Tabs.post({ type: Tabs.LOCAL_EDIT, dbName, filename });
			if (dbName === DBService.dbName) FileList.render(DOM.searchBar.value, false);
		} catch (err) {
			Status.show(`Couldn't save ${filename}: ${err.message}`, true);
		}
	};

	const Files = {
		isSymlinkEditMode: () => isSymlinkEditMode,
		setSymlinkEditMode(value) { isSymlinkEditMode = value; },

		// `hops` counts symlinks followed on the way here, to stop a loop.
		async open(filename, skipHistory = false, hops = 0) {
			await Files.flushPendingEdit();
			const absolutePath = Forest.getAbsolutePath(Config.activeWorkspaceId, filename);
			const matchedId = Forest.getExactMount(absolutePath);

			if (matchedId) {
				return Workspaces.switchTo(matchedId); // Teleport!
			}
			// ----------------------------------

			let note;
			try {
				note = await DBService.get(filename);
			} catch (err) {
				// Most likely a wedged IndexedDB connection (see DBService.DB_TIMEOUT_MS)
				// — without this, a click here would previously do nothing at all.
				return Status.show(`Couldn't open ${filename}: ${err.message}`, true);
			}
			if (!note) return Status.show(`${filename} is not stored locally.`, true);

			// --- 2. UNMOUNTED FOLDER INTERCEPTOR ---
			if (note.is_folder) {
				return Status.show(`Cannot open directory: No sub-workspace is mounted for '/${absolutePath}'.`, true);
			}
			// ---------------------------------------

			// --- 3. THE SYMLINK INTERCEPTOR ---
			if (filename.endsWith('.symlink') && !isSymlinkEditMode) {
				const target = Symlink.target(note.content);
				if (!target) return Status.show(`⚠️ ${filename} names no target.`, true);
				if (hops >= 8) return Status.show(`❌ Too many symlinks in a row at ${filename}.`, true);

				const found = Target.resolve(target, { from: { sig: Forest.activeTreeSignature(), path: absolutePath } });
				if (found.error) return Status.show(`❌ ${found.error}`, true);
				if (found.workspaceId !== Config.activeWorkspaceId || !found.filename) Workspaces.switchTo(found.workspaceId, skipHistory);
				if (found.filename) return Files.open(found.filename, skipHistory, hops + 1);
				return;
			}
			// ----------------------------------

			// Standard Editor Boot Sequence
			if (!skipHistory) {
			    history.pushState(
			        { workspaceId: Config.activeWorkspaceId, filename: filename },
			        null,
			        '#' + Target.encode(Target.forWorkspace(Config.activeWorkspaceId, filename))
			    );
			}

			if (window.innerWidth < 768) {
				Sidebar.collapse();
			}

			Editor.activate(filename, note.content);
			FileList.render(DOM.searchBar.value, false);
		},

		async create() {
			let filename = prompt('Enter filename (e.g., folder/draft.txt):');
			if (!filename) return;
			if (!filename.includes('.')) filename += '.txt';

			if (await DBService.get(filename)) return alert('File already exists locally.');

			await DBService.put({ filename, content: '', last_synced_sha: null, remote_sha: null, is_dirty: true });
			Tabs.post({ type: Tabs.SIDEBAR_REFRESH });
			Files.open(filename);
		},

		async handleUpload(event) {
			const file = event.target.files[0];
			if (!file) return;

			event.target.value = '';

			if (file.size > SyncService.fileUploadSizeLimit()) {
				return Status.show('File is too large.', true);
			}

			let filename = prompt('Confirm or rename file path (e.g., archive.zip):', file.name);
			if (!filename) return;

			const existing = await DBService.get(filename);
			if (existing && !confirm(`Overwrite existing local file "${filename}"?`)) return;

			const isText = FileTypes.isTextFile(filename);
			let content;

			if (!isText) {
				content = new Blob([file], { type: file.type || 'application/octet-stream' });
			} else {
				content = await file.text();
			}

			await DBService.put({
				filename,
				content,
				last_synced_sha: existing ? existing.last_synced_sha : null,
				remote_sha: existing ? existing.remote_sha : null,
				is_dirty: true
			});

			Status.show(`Successfully imported ${filename}.`);
			Tabs.post({ type: Tabs.SIDEBAR_REFRESH });
			Files.open(filename);
		},

		// Saves a pasted image straight into the local cache, without opening it.
		async savePastedImage(blob) {
			const ext = blob.type.split('/')[1] || 'png';
			let filename = prompt('Upload image directly to repository:', `images/image.${ext}`);

			if (!filename) {
				Status.show('Image upload cancelled.');
				return;
			}

			if (!filename.includes('.')) filename += `.${ext}`;

			Status.show(`Saving ${filename}...`);

			await DBService.put({
				filename: filename,
				content: blob,
				last_synced_sha: null,
				remote_sha: null,
				is_dirty: true
			});

			// Only update the file tree, do not touch the editor
			Tabs.post({ type: Tabs.SIDEBAR_REFRESH });
			Status.show(`Successfully saved ${filename}.`);
		},

		// Debounced autosave from the editor. The target file and database are
		// captured now, not when the timer fires: by then the user may have
		// opened another file or switched workspace.
		handleTyping(newContent) {
			const filename = Editor.currentFilename();
			if (!filename) return;
			const dbName = DBService.dbName;

			if (pendingEdit && (pendingEdit.filename !== filename || pendingEdit.dbName !== dbName)) {
				Files.flushPendingEdit();
			}
			clearTimeout(typingTimer);
			pendingEdit = { filename, dbName, content: newContent };
			typingTimer = setTimeout(() => Files.flushPendingEdit(), 500);
		},

		// Writes the debounced edit now, if there is one. Anything that reads a
		// note back, replaces the editor or leaves the page awaits this first.
		// Resolves once every write started so far has finished.
		flushPendingEdit() {
			clearTimeout(typingTimer);
			const edit = pendingEdit;
			pendingEdit = null;
			if (edit) writing = writing.then(() => saveEdit(edit));
			return writing;
		},

		async remove() {
			const filename = Editor.currentFilename();
			if (!filename) return;
			await Files.flushPendingEdit();
			const note = await DBService.get(filename);
			if (!note) return;

			const msg = note.last_synced_sha ? `Delete ${filename} from local AND remote?` : `Delete ${filename} locally?`;
			if (!confirm(msg)) return;

			try {
				if (note.last_synced_sha) {
					Status.show(`Deleting ${filename} remotely...`);
					await SyncService.deleteFile(filename, note.last_synced_sha);
				}
				await DBService.delete(filename);
				Editor.reset();
				history.replaceState(null, null, window.location.pathname);
				Tabs.post({ type: Tabs.SIDEBAR_REFRESH });
				FileList.render();
				Status.show('File deleted successfully.');
			} catch (err) {
				Status.show(`Error: ${err.message}`, true);
			}
		},

		// Exports the current file to the user's local disk via a browser download.
		// This is intentionally independent of any remote provider — it works even
		// for a workspace with no keychain configured at all, since it only reads
		// from the local IndexedDB cache (plus whatever's live in the editor).
		async exportFile() {
			const filename = Editor.currentFilename();
			if (!filename) return;

			try {
				await Files.flushPendingEdit();
				const note = await DBService.get(filename);
				if (!note) return Status.show('Nothing to export: file not found locally.', true);

				// The flush above saved the last debounced edit, but a keystroke
				// can still land after it. Text-based plugins (Text/Markdown) expose their live
				// textarea; prefer that. Read-only viewers (Image/PDF/Unsupported)
				// have no edit buffer, so note.content — the Blob itself — is
				// already authoritative for them.
				const plugin = Editor.activePlugin();
				const liveContent = (plugin && plugin.textarea) ? plugin.textarea.value : note.content;

				const blob = liveContent instanceof Blob
					? liveContent
					: new Blob([liveContent ?? ''], { type: 'text/plain;charset=utf-8' });

				// Use only the basename for the download — the full VFS path (e.g.
				// "docs/notes.md") isn't a valid target for a flat Downloads folder.
				const basename = filename.includes('/') ? filename.substring(filename.lastIndexOf('/') + 1) : filename;

				const url = URL.createObjectURL(blob);
				const link = document.createElement('a');
				link.href = url;
				link.download = basename;
				document.body.appendChild(link);
				link.click();
				link.remove();

				// Revoke on a delay rather than immediately — some browsers kick off
				// the download asynchronously and a same-tick revoke can race it.
				setTimeout(() => URL.revokeObjectURL(url), 1000);

				Status.show(`Exported ${basename}.`);
			} catch (err) {
				Status.show(`Export failed: ${err.message}`, true);
			}
		},
	};

	return Files;
});
//# sourceURL=src/actions/files.js
</script>
<script>
// The plugin host: how a plugin instance reads files besides its own.
//
// It reads stored files of the open file's repository (forest tree: same
// repo and branch), as of the workspace that was active at mount time:
// never for writing, never from the network. Paths are relative to the
// open file (or start at the repo root with '/'). They may cross mount
// points, but not go above the repo root, and .symlink files are never
// followed. Every file read is watched, so the plugin hears when it changes.
//
//   const host = Host.create(filename);
//   host.api       // { read(path), onChange(cb) }, handed to the plugin's mount
//   host.reads()   // the paths read so far, for the app
//   host.dispose() // on unmount
define('actions/host', ['model/config', 'model/forest', 'lib/path', 'storage/notesDb'], (Config, Forest, Path, DBService) => {
	const COALESCE_MS = 250;

	// Hosts of mounted plugins, told about writes made in other tabs.
	const live = new Set();

	// The form a path is resolved in: trimmed and percent-decoded, so
	// 'my%20pic.png' and 'my pic.png' are the same file.
	const normalize = (path) => {
		const s = String(path).trim();
		try { return decodeURIComponent(s); } catch { return s; }
	};
	// URLs, protocol-relative links and anchors are not paths.
	const isExternal = (path) => !path || /^([a-z][a-z0-9+.-]*:|\/\/|#)/i.test(path);

	const Host = {
		COALESCE_MS,

		create(filename) {
			const wsId = Config.activeWorkspaceId;
			const ws = Config.workspaces[wsId];
			const sig = ws ? Forest.computeTreeSig(ws, Config.keychains[ws.keychainId]) : null;
			const selfPath = Forest.getAbsolutePath(wsId, filename);

			let disposed = false;
			const listeners = new Set();
			const pending = new Set();
			let timer = null;
			// Paths read so far: path -> where it was looked up ({ dbName, filename } or null).
			const watched = new Map();

			// A path -> { dbName, filename } of the deepest workspace of the tree
			// that holds it, or null when none does. Throws for a path above the
			// repo root or through a .symlink.
			const resolve = (path) => {
				if (isExternal(path)) throw new Error(`${path} is not a path in the repository`);
				const absolutePath = Path.resolveWithin(selfPath, path);
				if (absolutePath === null) throw new Error(`${path} is outside the repository`);
				if (absolutePath.split('/').some(part => /\.symlink$/i.test(part))) throw new Error(`${path}: symlinks are not followed`);
				if (!sig) return null;
				const id = Forest.resolveBestFit(absolutePath, sig);
				if (!id) return null;
				const relative = Forest.getRelativePath(id, absolutePath);
				return relative ? { dbName: Config.workspaces[id].dbName, filename: relative } : null;
			};

			const notify = (paths) => {
				if (disposed || !paths.length) return;
				paths.forEach(p => pending.add(p));
				if (timer) return;
				timer = setTimeout(() => {
					timer = null;
					if (disposed) return;
					const changed = [...pending];
					pending.clear();
					for (const cb of [...listeners]) {
						try { cb({ paths: changed }); } catch (err) { console.error(err); }
					}
				}, COALESCE_MS);
			};

			// A stored file changed (this tab or another): was it read here?
			// Mounts are looked up again, since one may have been added since.
			const written = ({ dbName, filename: changed }) => {
				const hit = [];
				for (const path of watched.keys()) {
					let target;
					try { target = resolve(path); } catch { continue; }
					watched.set(path, target);
					if (target && target.dbName === dbName && (changed === null || target.filename === changed)) hit.push(path);
				}
				notify(hit);
			};

			const api = Object.freeze({
				// The stored copy: { content, isDirty } (text as a string, binary as
				// a Blob), or null if it isn't stored here.
				async read(path) {
					if (disposed) return null;
					const key = normalize(path);
					const target = resolve(key);
					watched.set(key, target);
					if (!target) return null;
					const note = await DBService.get(target.filename, target.dbName);
					if (disposed || !note || note.is_folder) return null;
					return { content: note.content, isDirty: !!note.is_dirty };
				},

				// cb({ paths }) when files read through this host change in the
				// local store. Returns an unsubscribe function.
				onChange(cb) {
					if (disposed) return () => {};
					listeners.add(cb);
					return () => listeners.delete(cb);
				},
			});

			const unsubscribe = DBService.onWrite(written);

			const host = {
				api,
				written,
				reads: () => [...watched.keys()],

				dispose() {
					if (disposed) return;
					disposed = true;
					clearTimeout(timer);
					listeners.clear();
					pending.clear();
					unsubscribe();
					live.delete(host);
				},
			};
			live.add(host);
			return host;
		},

		// A write made in another tab (app/crossTab forwards them).
		changed(dbName, filename) {
			for (const host of [...live]) host.written({ dbName, filename });
		},
	};

	return Host;
});

</script>

<script>
// Conflict markers for a pull that collides with local edits.
define('actions/merge', [], () => ({
	// Line diff based markers. `Diff` is the jsdiff library. Each run of
	// changed lines becomes one hunk, local side first as in git:
	//
	//     <<<<<<< LOCAL
	//     (local lines)
	//     =======
	//     (remote lines)
	//     >>>>>>> REMOTE
	//
	// Either side may be empty (a line added or deleted on one side only).
	diffMarkers(Diff, remoteContent, localContent) {
		const asLines = (text) => text && !text.endsWith('\n') ? text + '\n' : text;
		let merged = '';
		let local = '';
		let remote = '';
		let inHunk = false;
		const closeHunk = () => {
			if (!inHunk) return;
			merged += `<<<<<<< LOCAL\n${asLines(local)}=======\n${asLines(remote)}>>>>>>> REMOTE\n`;
			local = remote = '';
			inHunk = false;
		};

		// diffLines(remote, local): "removed" is remote-only, "added" local-only.
		for (const part of Diff.diffLines(remoteContent, localContent)) {
			if (part.added) local += part.value;
			else if (part.removed) remote += part.value;
			else {
				closeHunk();
				merged += part.value;
				continue;
			}
			inHunk = true;
		}
		closeHunk();
		return merged;
	},

	// Fallback when the diff engine isn't available: the whole file on each side.
	wholeFileMarkers(remoteContent, localContent) {
		return `<<<<<<< LOCAL\n${localContent}\n=======\n${remoteContent}\n>>>>>>> REMOTE`;
	},
}));
//# sourceURL=src/actions/merge.js
</script>
<script>
// Pins live at the tree (forest) level as absolute paths, so a pin can open
// a file in whichever mount point currently covers it.
define('actions/pins',
	['model/config', 'model/forest', 'storage/notesDb', 'ui/refs', 'ui/editor', 'ui/pins', 'ui/fileList', 'ui/status', 'actions/files', 'actions/workspaces'],
	(Config, Forest, DBService, DOM, Editor, PinsView, FileList, Status, Files, Workspaces) => ({

	add() {
		const pinRelative = prompt('Enter a filename or directory path to pin (e.g., docs/ or README.md):', Editor.currentFilename() || '');
		if (!pinRelative) return;

		// 1. Compute the absolute path for Forest-level storage
		const absolutePath = Forest.getAbsolutePath(Config.activeWorkspaceId, pinRelative);

		// 2. Save it to the Tree Signature
		const sig = Forest.activeTreeSignature();
		if (!sig) return;

		if (!Config.treePins[sig]) Config.treePins[sig] = [];
		if (!Config.treePins[sig].includes(absolutePath)) {
			Config.treePins[sig].push(absolutePath);
			Config.savePins();
			PinsView.render();
		}
	},

	remove(absolutePath, event) {
		event.stopPropagation();
		const sig = Forest.activeTreeSignature();
		if (!sig || !Config.treePins[sig]) return;

		const index = Config.treePins[sig].indexOf(absolutePath);
		if (index > -1) {
			Config.treePins[sig].splice(index, 1);
			Config.savePins();
			PinsView.render();
		}
	},

	// Editing a tree's origin (keychain, host, owner, repo, branch) changes
	// its signature; carry its pins over instead of orphaning them. If the
	// new signature already has pins (two trees merging), the lists merge.
	rekey(oldSig, newSig) {
		const moved = Config.treePins[oldSig];
		if (oldSig === newSig || !moved) return;
		const existing = Config.treePins[newSig] || [];
		Config.treePins[newSig] = [...existing, ...moved.filter(p => !existing.includes(p))];
		delete Config.treePins[oldSig];
		Config.savePins();
		PinsView.render();
	},

	async open(absolutePath) {
		const matchedId = Forest.resolveBestFit(absolutePath);

		if (!matchedId) {
			return Status.show(`Cannot open pin: No workspace is mounted for this path.`, true);
		}

		// 2. Switch to the target environment
		if (matchedId !== Config.activeWorkspaceId) {
			Workspaces.switchTo(matchedId);
		}

		const relativePath = Forest.getRelativePath(matchedId, absolutePath);
		// 4. Open the file (or directory)
		if (relativePath) {
			const note = await DBService.get(relativePath);
			if (note) {
				Files.open(relativePath);
			} else {
				// Fallback: Dump it in the search bar if it hasn't been pulled locally yet
				DOM.searchBar.value = relativePath;
				FileList.render(relativePath, false);
			}
		}
	},
}));
//# sourceURL=src/actions/pins.js
</script>

define('actions/settings',
	['model/config', 'model/forest', 'ui/refs', 'ui/editor', 'ui/settings', 'ui/sidebar'],
	(Config, Forest, DOM, Editor, SettingsView, Sidebar) => ({

	open() {
		Editor.reset();
		history.replaceState(null, null, window.location.pathname);

		DOM.filenameLabel.textContent = 'Settings & Profiles';

		Editor.setLayerVisible(DOM.editLayer, false);
		Editor.setLayerVisible(DOM.viewLayer, false);

		DOM.settingsPanel.style.display = 'block';
		SettingsView.render();

		if (window.innerWidth < 768) Sidebar.collapse();
	},

	// Called by the settings view on every committed change; it shows its
	// own quiet "Saved ✓", so no status message here.
	save() {
		const forced = this.forceShallowParents();
		Config.saveKeychains();
		Config.saveWorkspaces();
		if (forced) SettingsView.render();
	},

	// A workspace with a mount below it must be shallow (Forest.hasMountsBelow).
	// The stored flag is set here, so it always says what Refresh will do; it
	// stays set when the mounts below go away. Returns whether anything changed.
	forceShallowParents() {
		let changed = false;
		for (const id of Object.keys(Config.workspaces)) {
			if (!Config.workspaces[id].shallow && Forest.hasMountsBelow(id)) {
				Config.workspaces[id].shallow = true;
				changed = true;
			}
		}
		return changed;
	},
}));

<script>
// Remote synchronization, always explicit: refresh the file list, pull or push one file.
define('actions/sync',
	['model/config', 'storage/notesDb', 'remote/sync', 'lib/encoding', 'lib/dom', 'lib/fileTypes', 'lib/tabChannel', 'resources',
	 'ui/refs', 'ui/editor', 'ui/fileList', 'ui/status', 'actions/merge', 'actions/files'],
	(Config, DBService, SyncService, Encoding, Dom, FileTypes, Tabs, R,
	 DOM, Editor, FileList, Status, Merge, Files) => {

	// Note contents are strings, or Blobs for binary files (compared by bytes).
	const sameContent = async (a, b) => {
		if (!(a instanceof Blob) || !(b instanceof Blob)) return a === b;
		if (a.size !== b.size || a.type !== b.type) return false;
		const [x, y] = await Promise.all([a.arrayBuffer(), b.arrayBuffer()]).then(bs => bs.map(buf => new Uint8Array(buf)));
		return x.every((byte, i) => byte === y[i]);
	};

	// Notes the remote listing covers but no longer contains (D5). A shallow
	// listing covers only the top level. Notes never seen remotely are
	// local-only already and are left alone.
	const missingFromTree = (notes, tree, shallow) => {
		const listed = new Set(tree.map(item => item.path));
		return notes.filter(note => note.remote_sha
			&& !listed.has(note.filename)
			&& !(shallow && note.filename.includes('/')));
	};

	// A missing note with nothing local (a placeholder Refresh created and
	// nobody pulled, or a folder entry) is dropped. Anything else becomes a
	// local-only file, which a push creates again.
	const holdsNothingLocal = (note) => note.is_folder || (!note.last_synced_sha && !note.is_dirty);

	// What a refresh writes, from the stored notes and the listing (pure, so it
	// can run inside one IndexedDB transaction: E5).
	//   - every listed file gets its remote sha, or a placeholder if not stored;
	//   - in a shallow workspace, nested notes are left over from a deep listing
	//     or a link, and under a mount they duplicate its files (D7): clean ones
	//     are dropped, edited ones kept;
	//   - notes the listing no longer has are handled as above (D5), unless the
	//     listing was truncated and can't tell.
	const planRefresh = (notes, files, { shallow, truncated }) => {
		const byName = new Map(notes.map(note => [note.filename, note]));
		const put = [];
		const drop = [];
		let nestedKept = 0;
		let nowLocalOnly = 0;

		for (const file of files) {
			const isFolder = file.type === 'folder';
			const note = byName.get(file.path);
			put.push(note
				? { ...note, remote_sha: file.sha, is_folder: isFolder }
				: { filename: file.path, content: isFolder ? null : '', last_synced_sha: null, remote_sha: file.sha, is_dirty: false, is_folder: isFolder });
		}

		if (shallow) {
			for (const note of notes.filter(n => n.filename.includes('/'))) {
				if (note.is_dirty && !note.is_folder) nestedKept++;
				else drop.push(note.filename);
			}
		}

		if (!truncated) {
			for (const note of missingFromTree(notes, files, shallow)) {
				if (holdsNothingLocal(note)) {
					drop.push(note.filename);
				} else {
					put.push({ ...note, remote_sha: null, last_synced_sha: null, is_dirty: true });
					nowLocalOnly++;
				}
			}
		}
		return { put, delete: drop, nestedKept, nowLocalOnly };
	};

	return {
		async refreshTree() {
			try {
				Status.show('Refreshing file list remotely...');
				// The listing is written to the workspace it was made for, even if
				// the user switches away during the network call.
				const { dbName, shallow } = Config.activeWorkspace;
				const treeData = await SyncService.getTree();
				// Keep both blobs and folders so they enter IndexedDB
				const files = treeData.tree.filter(item => item.type === 'blob' || item.type === 'folder');

				// Edits typed during the network call must be stored before the plan reads them.
				await Files.flushPendingEdit();
				const { delete: dropped, nestedKept, nowLocalOnly } = await DBService.rewriteAll(
					notes => planRefresh(notes, files, { shallow, truncated: treeData.truncated }), dbName);
				if (DBService.dbName === dbName && dropped.includes(Editor.currentFilename())) Editor.reset();

				const count = (n) => n === 1 ? '1 file' : `${n} files`;
				if (treeData.truncated) {
					Status.show('⚠️ File list incomplete: GitHub truncated this tree. Mount large sub-directories separately, or mark them Shallow.', true);
				} else {
					Status.show(['File list updated.',
						nowLocalOnly && `${count(nowLocalOnly)} deleted remotely ${nowLocalOnly === 1 ? 'is' : 'are'} now local-only.`,
						nestedKept && `Kept ${count(nestedKept)} in subfolders with unpushed edits.`,
					].filter(Boolean).join(' '));
				}
				Tabs.post({ type: Tabs.SIDEBAR_REFRESH });
				FileList.render(DOM.searchBar.value, false);
			} catch (err) {
				Status.show(`Refresh failed: ${err.message}`, true);
			}
		},

		// Pull and push read the note, wait on the network, then write it back.
		// The user can keep typing meanwhile, or switch file or workspace, so both
		// flush the pending autosave before and after the network call, write
		// back only into the workspace they started in, and decide from the note
		// as it is after the call, never from the snapshot taken before it.
		async pull() {
			const filename = Editor.currentFilename();
			if (!filename) return;
			const dbName = DBService.dbName;

			try {
				await Files.flushPendingEdit();
				Status.show(`Pulling ${filename}...`);

				// Must agree with the providers, whose content is a Blob for every non-text file.
				const isBinary = FileTypes.isBinaryFile(filename);
				const fileResponse = await SyncService.getFile(filename);

				await Files.flushPendingEdit();
				let localNote = await DBService.get(filename, dbName);
				if (!localNote) {
					localNote = { filename, content: '', last_synced_sha: null, remote_sha: null, is_dirty: false };
				}

				if (isBinary) {
					localNote.content = fileResponse.content;
					localNote.is_dirty = false;
					// Without a sha (GitHub without crypto.subtle), fall back to the listed one.
					const sha = fileResponse.sha || localNote.remote_sha;
					localNote.last_synced_sha = sha;
					localNote.remote_sha = sha;
				} else {
					const remoteContent = Encoding.atou(fileResponse.content);
					if (localNote.is_dirty && localNote.content !== remoteContent) {
						const choice = prompt(`Conflict in ${filename}!\nd: Insert Diff markers\nw: Overwrite local with remote\ni: Ignore remote`, "d");
						if (choice === null) return Status.show("Pull cancelled.");

						if (choice === "w") {
							localNote.content = remoteContent;
							localNote.is_dirty = false;
						} else if (choice === "i") {
							localNote.is_dirty = true;
						} else {
							Status.show(`Loading diff engine...`);
							try {
								await Dom.loadResource(R.jsdiff);
							} catch (err) {
								return Status.show(`Error: Failed to load diff engine. Merge cancelled.`, true);
							}

							// Typing may have continued while the engine loaded.
							await Files.flushPendingEdit();
							localNote = (await DBService.get(filename, dbName)) || localNote;

							Status.show(`Injecting merge markers...`, true);
							localNote.content = typeof Diff !== 'undefined'
								? Merge.diffMarkers(Diff, remoteContent, localNote.content)
								: Merge.wholeFileMarkers(remoteContent, localNote.content);
							localNote.is_dirty = true;
						}
					} else {
						localNote.content = remoteContent;
						localNote.is_dirty = false;
					}
					localNote.last_synced_sha = fileResponse.sha;
					localNote.remote_sha = fileResponse.sha;
				}

				await DBService.put(localNote, dbName);
				// Only redraw the editor if it still shows this file.
				if (Editor.currentFilename() === filename && DBService.dbName === dbName) {
					Editor.activate(filename, localNote.content);
				}
				Status.show(`Successfully pulled ${filename}.`);
				Tabs.post({ type: Tabs.SIDEBAR_REFRESH });
				FileList.render(DOM.searchBar.value, false);
			} catch (err) {
				Status.show(`Pull failed: ${err.message}`, true);
			}
		},

		async push() {
			const filename = Editor.currentFilename();
			if (!filename) return;
			const dbName = DBService.dbName;

			try {
				await Files.flushPendingEdit();
				const note = await DBService.get(filename, dbName);
				if (!note || !note.is_dirty) return Status.show(`${filename} is already up to date.`);

				let commitMsg = null;
				const kc = Config.activeKeychain;

				// Guard: Only prompt if the toggle is on AND the provider is GitHub (the only one with commits)
				if (Config.activeWorkspace.askForCommitMsg && kc && (kc.provider || 'github') === 'github') {
					const userMsg = prompt(`Enter commit message for ${filename}:`);
					if (userMsg == null) return Status.show("Push cancelled.");
					if (userMsg.trim()) commitMsg = userMsg.trim();
				}

				Status.show(`Pushing ${filename}...`);

				let base64Content;

				if (typeof note.content === 'object' && note.content !== null) {
					base64Content = await Encoding.blobToBase64(note.content);
				} else {
					base64Content = Encoding.utoa(String(note.content));
				}

				const responseData = await SyncService.putFile(filename, base64Content, note.last_synced_sha, commitMsg);

				// The remote now holds what was pushed. Record its sha either way, but
				// the note stays dirty if it was edited (or deleted) during the upload.
				await Files.flushPendingEdit();
				const current = await DBService.get(filename, dbName);
				const pushedSha = responseData.content.sha;
				if (current) {
					const unchanged = await sameContent(current.content, note.content);
					current.last_synced_sha = pushedSha;
					current.remote_sha = pushedSha;
					if (unchanged) current.is_dirty = false;
					await DBService.put(current, dbName);
					Status.show(unchanged
						? `Successfully pushed ${filename}.`
						: `Pushed ${filename}. Edits made during the upload are not pushed yet.`);
				} else {
					Status.show(`Pushed ${filename}, which was deleted locally meanwhile.`);
				}

				Tabs.post({ type: Tabs.SIDEBAR_REFRESH });
				FileList.render(DOM.searchBar.value, false);
			} catch (err) {
				Status.show(`Push error: ${err.message}`, true);
			}
		},
	};
});
//# sourceURL=src/actions/sync.js
</script>
<script>
define('actions/workspaces',
	['model/config', 'model/target', 'storage/notesDb', 'lib/tabChannel', 'ui/refs', 'ui/editor', 'ui/pins', 'ui/indicator', 'ui/fileList', 'ui/status', 'ui/settings', 'actions/settings'],
	(Config, Target, DBService, Tabs, DOM, Editor, PinsView, Indicator, FileList, Status, SettingsView, Settings) => {

	const Workspaces = {
		create() {
			const kcIds = Object.keys(Config.keychains);
			if (kcIds.length === 0) return alert("Please create a Keychain first.");

			const input = prompt('Enter Repository (e.g., rust-lang/cargo), a remoteStorage URL (https://…/storage/), or leave blank for Dropbox:');
			if (input === null) return;

			// A URL is a remoteStorage storage URL, which goes in `host`.
			const storageUrl = /^https?:\/\//i.test(input.trim()) ? input.trim() : '';
			const repoName = storageUrl ? '' : input;

			let owner = '';
			let repo = repoName;
			if (repoName.includes('/')) {
				[owner, repo] = repoName.split('/');
			}

			// Auto-select the right keychain provider based on input
			let targetKcId = kcIds[0];
			if (storageUrl) {
				const rsKc = kcIds.find(id => Config.keychains[id].provider === 'remotestorage');
				if (rsKc) targetKcId = rsKc;
			} else if (!repoName) {
				const dbxKc = kcIds.find(id => Config.keychains[id].provider === 'dropbox');
				if (dbxKc) targetKcId = dbxKc;
			} else {
				const ghKc = kcIds.find(id => Config.keychains[id].provider === 'github');
				if (ghKc) targetKcId = ghKc;
			}

			const id = 'ws_' + Date.now();
			Config.workspaces[id] = {
				name: storageUrl ? 'remoteStorage' : repoName ? repoName : 'Dropbox Storage',
				dbName: 'NotesDB_' + id,
				keychainId: targetKcId,
				host: storageUrl || 'https://api.github.com',
				owner: owner.trim(),
				repo: repo.trim(),
				branch: repoName ? 'main' : '',
				rootDir: '',
				shallow: false,
				askForCommitMsg: false,
			};

			Config.saveWorkspaces();
			Workspaces.switchTo(id);
			Settings.open();
		},

		createMountPoint(parentWs) {
			const newRoot = prompt(`Enter sub-directory path to mount (e.g., src/docs):`);
			if (newRoot === null) return; // User cancelled

			const id = 'ws_' + Date.now();

			// Clone all origin data, but reset the mount-specific data
			Config.workspaces[id] = {
				name: parentWs.name + ' (' + newRoot + ')',
				dbName: 'NotesDB_' + id,
				keychainId: parentWs.keychainId,
				host: parentWs.host,
				owner: parentWs.owner,
				repo: parentWs.repo,
				branch: parentWs.branch,
				rootDir: newRoot,
				shallow: false,
				askForCommitMsg: !!parentWs.askForCommitMsg,
			};

			Settings.forceShallowParents();
			Config.saveWorkspaces();
			SettingsView.render(); // Re-render to show the new row instantly
		},

		switchTo(id, skipHistory = false) {
			const ws = Config.workspaces[id];
			if (!ws) return;

			Config.setActiveWorkspace(id);

			Editor.reset();
			DOM.searchBar.value = '';

			// History API Upgrade: Push the workspace switch into the session history
			if (!skipHistory) {
				history.pushState(
					{ workspaceId: id, filename: null },
					null,
					'#' + Target.encode(Target.forWorkspace(id))
				);
			}

			PinsView.render();
			Indicator.update();
			FileList.render();
			Status.show(`Switched workspace: ${Config.workspaces[id].name}`);
		},

		remove(id) {
			if (Object.keys(Config.workspaces).length <= 1) return alert("You cannot delete your only workspace.");

			const wsName = Config.workspaces[id].name;
			const dbName = Config.workspaces[id].dbName;

			if (!confirm(`WARNING: Permanently delete workspace "${wsName}" AND wipe all its local data?\n\nThis action cannot be undone.`)) return;

			// 1. Purge the isolated database directly from the browser's storage
			indexedDB.deleteDatabase(dbName);

			// 2. Remove the workspace from memory
			delete Config.workspaces[id];
			Config.saveWorkspaces();

			// 3. UI Routing
			if (Config.activeWorkspaceId === id) {
				const fallbackId = Object.keys(Config.workspaces)[0];
				Workspaces.switchTo(fallbackId);
				Settings.open();
			} else {
				SettingsView.render();
			}
		},

		// Wipes the local cache of a workspace (not the workspace itself).
		async clearDB(id) {
			const ws = Config.workspaces[id];
			if (!ws) return;

			if (!confirm(`WARNING: Permanently wipe all local notes for workspace "${ws.name}"?\n\n(This does not delete the workspace itself, just its offline cache.)`)) return;

			try {
				if (id === Config.activeWorkspaceId) {
					await DBService.clear();
					Editor.reset();
					history.replaceState(null, null, window.location.pathname);
					FileList.render();
					Tabs.post({ type: Tabs.SIDEBAR_REFRESH });
					Status.show(`Local cache cleared for ${ws.name}.`);
				} else {
					indexedDB.deleteDatabase(ws.dbName);
					Status.show(`Local cache cleared for ${ws.name}.`);
				}
			} catch(err) {
				Status.show(`Failed to clear local cache.`, true);
			}
		},

		// First run (or a corrupted active id): make sure there is an active workspace.
		ensureDefaultState() {
			// 1. Check if we already have a valid, active workspace. If so, we are done.
			if (Config.activeWorkspace) {
				return;
			}

			// 2. We don't have an active workspace. Do we have ANY workspaces left?
			// (This handles the edge case where the active ID was corrupted or deleted)
			const existingWsIds = Object.keys(Config.workspaces);
			if (existingWsIds.length > 0) {
				Workspaces.switchTo(existingWsIds[0]);
				return;
			}

			// 3. The app is completely blank. We must generate the default relational state.
			let defaultKcId;
			const existingKcIds = Object.keys(Config.keychains);

			if (existingKcIds.length > 0) {
				defaultKcId = existingKcIds[0];
			} else {
				// Create an empty default Keychain
				defaultKcId = 'kc_default';
				Config.keychains[defaultKcId] = {
					name: 'Default Credentials',
					provider: 'github',
					token: '',
					appKey: '',
					refreshToken: ''
				};
				Config.saveKeychains();
			}

			// 4. Create the default Workspace linked to the Keychain
			const defaultWsId = 'ws_default';
			Config.workspaces[defaultWsId] = {
				name: 'Local Workspace',
				dbName: 'NotesDB_default',
				keychainId: defaultKcId,
				host: 'https://api.github.com',
				owner: '',
				repo: '',
				branch: 'main',
				rootDir: '',
				shallow: false,
				askForCommitMsg: false,
			};
			Config.saveWorkspaces();

			// 5. Safely boot the app into the new default workspace
			Workspaces.switchTo(defaultWsId);
		},
	};

	return Workspaces;
});
//# sourceURL=src/actions/workspaces.js
</script>
<script>
// Composition root: the one place that knows both the views and the actions.
// It wires view callbacks to actions, maps data-action attributes in
// index.html to functions, installs global listeners and starts the app.
define('app/boot',
	['model/config', 'remote/dropboxAuth',
	 'ui/refs', 'ui/editor', 'ui/fileList', 'ui/pins', 'ui/indicator', 'ui/settings', 'ui/sidebar', 'ui/status',
	 'actions/files', 'actions/sync', 'actions/pins', 'actions/workspaces', 'actions/keychains', 'actions/settings', 'actions/host',
	 'app/router', 'app/shortcuts', 'app/paste', 'app/crossTab', 'app/serviceWorker'],
	(Config, DropboxAuth,
	 DOM, Editor, FileList, PinsView, Indicator, SettingsView, Sidebar, Status,
	 Files, Sync, Pins, Workspaces, Keychains, Settings, Host,
	 Router, Shortcuts, Paste, CrossTab, ServiceWorker) => {

	// Everything a data-action="..." attribute in index.html can trigger.
	const actions = {
		'files.create': () => Files.create(),
		'files.pickUpload': () => DOM.fileInput.click(),
		'files.export': () => Files.exportFile(),
		'files.delete': () => Files.remove(),
		'sync.refresh': () => Sync.refreshTree(),
		'sync.pull': () => Sync.pull(),
		'sync.push': () => Sync.push(),
		'pins.add': () => Pins.add(),
		'settings.open': () => Settings.open(),
		'sidebar.toggle': () => Sidebar.toggle(),
		'editor.toggleView': () => Editor.toggleViewMode(),
	};

	const bindViews = () => {
		Editor.bind({
			onEdit: (content) => Files.handleTyping(content),
			onLeave: () => Files.flushPendingEdit(),
			makeHost: (filename) => Host.create(filename),
		});
		FileList.bind({
			open: (filename) => Files.open(filename),
			goUp: (workspaceId) => Workspaces.switchTo(workspaceId),
		});
		PinsView.bind({
			open: (absolutePath) => Pins.open(absolutePath),
			remove: (absolutePath, event) => Pins.remove(absolutePath, event),
		});
		SettingsView.bind({
			save: () => Settings.save(),
			createKeychain: () => Keychains.create(),
			deleteKeychain: (id) => Keychains.remove(id),
			linkDropbox: (id) => DropboxAuth.link(id),
			createWorkspace: () => Workspaces.create(),
			createMountPoint: (parentWs) => Workspaces.createMountPoint(parentWs),
			switchWorkspace: (id) => Workspaces.switchTo(id),
			clearDB: (id) => Workspaces.clearDB(id),
			deleteWorkspace: (id) => Workspaces.remove(id),
			isSymlinkEditMode: () => Files.isSymlinkEditMode(),
			setSymlinkEditMode: (value) => Files.setSymlinkEditMode(value),
			rekeyPins: (oldSig, newSig) => Pins.rekey(oldSig, newSig),
		});
	};

	const installGlobalListeners = () => {
		CrossTab.install();
		ServiceWorker.install();
		Router.install();
		Shortcuts.install();
		Paste.install();

		document.addEventListener('click', (e) => {
			const el = e.target.closest('[data-action]');
			if (el && actions[el.dataset.action]) actions[el.dataset.action](e);
		});

		// Safety net: several click handlers (open, create, pins, ...) call
		// DBService directly without their own try/catch, on the assumption that
		// local IndexedDB reads/writes essentially never fail. That's no longer true
		// now that DBService operations can time out (see DBService.DB_TIMEOUT_MS) —
		// e.g. after Chrome/Android freezes a backgrounded PWA and IndexedDB comes
		// back wedged. Rather than auditing every call site, catch anything that
		// slips through here so a failure always surfaces in the status bar instead
		// of silently doing nothing (which is the exact symptom this is fixing).
		window.addEventListener('unhandledrejection', (event) => {
			const message = event.reason && event.reason.message ? event.reason.message : String(event.reason);
			console.error('Unhandled rejection:', event.reason);
			Status.show(`⚠️ ${message}`, true);
			event.preventDefault();
		});

		// Save the debounced edit when the page goes away, and the open
		// settings, whose inputs save on 'change' (a closing tab may never fire
		// it). On mobile, 'hidden' is often the last event a backgrounded page
		// gets before it is killed.
		const saveOnLeave = () => {
			Files.flushPendingEdit();
			if (DOM.settingsPanel && DOM.settingsPanel.style.display === 'block') Settings.save();
		};
		window.addEventListener('pagehide', saveOnLeave);
		document.addEventListener('visibilitychange', () => {
			if (document.visibilityState === 'hidden') saveOnLeave();
		});

		window.addEventListener('offline', () => Status.show('📴 You are offline. Changes will save locally.', true));
		window.addEventListener('online', () => Status.show('📶 You are back online. Safe to Push/Pull.'));
	};

	const onDomReady = async () => {
		// 1. Capture the DOM nodes
		DOM.init();

		// 2. Heal the state if it's a first-time load (or orphaned)
		Workspaces.ensureDefaultState();

		// 3. Render the UI safely using the active workspace
		Indicator.update();
		FileList.render();
		PinsView.render();

		// 4. Handle OAuth redirects if necessary
		await DropboxAuth.handleRedirect();

		// 5. Wire up local DOM event listeners
		DOM.fileInput.addEventListener('change', (e) => Files.handleUpload(e));
		DOM.searchBar.addEventListener('input', () => FileList.render(DOM.searchBar.value, false));
		DOM.searchBar.addEventListener('keydown', (e) => {
			if (e.key === 'Enter') {
				e.preventDefault();
				FileList.render(DOM.searchBar.value, true);
			}
		});

		// 6. Wire up the View Layer link interceptor (Hypermedia routing)
		Router.installLinkRouting();

		// 7. Check if there is a file hash in the URL to open on boot
		Router.openFromHash();
	};

	return {
		actions,

		start() {
			Config.load();
			bindViews();
			installGlobalListeners();
			window.addEventListener('DOMContentLoaded', onDomReady);
		},
	};
});

<script>
// Navigation: history entries for files and workspace switches, the URL hash
// on boot, and relative links clicked inside rendered documents.
define('app/router',
	['model/config', 'model/target', 'storage/notesDb', 'lib/path', 'ui/refs', 'ui/editor', 'ui/fileList', 'ui/status', 'actions/files', 'actions/workspaces'],
	(Config, Target, DBService, Path, DOM, Editor, FileList, Status, Files, Workspaces) => {

	// Opens what a URL hash names (model/target), without adding history.
	const openTarget = (target) => {
		const found = Target.resolve(target);
		if (found.error) return Status.show(found.error, true);
		if (found.workspaceId !== Config.activeWorkspaceId || !found.filename) Workspaces.switchTo(found.workspaceId, true);
		if (found.filename) Files.open(found.filename, true);
	};

	const onPopState = (e) => {
		const state = e.state;

		// Route A: Rich Session Navigation (The user clicked Back/Forward)
		if (state && state.workspaceId) {
			// 1. If the history entry belongs to a different workspace, swap environments safely
			if (state.workspaceId !== Config.activeWorkspaceId) {
				Workspaces.switchTo(state.workspaceId, true); // true = skipHistory
			}

			// 2. Restore the specific file view, or reset to the root tree
			if (state.filename) {
				Files.open(state.filename, true);
			} else {
				Editor.reset();
				FileList.render(DOM.searchBar.value, false);
			}
			return;
		}

		// Route B: Cold Boot / Manual Hash Edit (No state object available)
		const hash = window.location.hash.substring(1);
		if (hash) {
			openTarget(Target.decode(hash));
		} else {
			Editor.reset();
			FileList.render(DOM.searchBar.value, false);
		}
	};

	// Hypermedia routing: a relative link in the view layer opens the local file.
	const onViewLayerClick = (e) => {
		let target = e.target;
		while (target && target.tagName !== 'A') target = target.parentNode;

		if (target && target.tagName === 'A') {
			const href = target.getAttribute('href');

			if (href && !href.match(/^(http|https|mailto:|data:|#)/i)) {
				e.preventDefault();

				const pathWithoutHash = href.split('#')[0];
				const targetPath = Path.resolvePath(Editor.currentFilename(), pathWithoutHash);

				DOM.searchBar.value = '';

				(async () => {
					let finalPath = targetPath;
					let note = await DBService.get(finalPath);

					// Fuzzy routing fallback
					if (!note) {
						const allKeys = await DBService.getAllKeys();
						const target = Path.parsePath(targetPath);
						const candidates = allKeys.filter(key => {
							const k = Path.parsePath(key);
							return k.dir === target.dir && k.basename === target.basename && key !== targetPath;
						});

						if (candidates.length === 1) {
							finalPath = candidates[0];
							note = await DBService.get(finalPath);
							Status.show(`Rerouted: ${target.filename} → ${Path.parsePath(finalPath).filename}`);
						}
					}

					if (note) {
						Files.open(finalPath);
					} else {
						Status.show(`The file "${targetPath}" does not exist locally.`, true);
					}
				})();
			}
		}
	};

	return {
		install() {
			window.addEventListener('popstate', onPopState);
		},

		// Needs the DOM.
		installLinkRouting() {
			DOM.viewLayer.addEventListener('click', onViewLayerClick);
		},

		// Opens the file named in the URL hash, if any.
		openFromHash() {
			const hash = window.location.hash.substring(1);
			if (hash) openTarget(Target.decode(hash));
		},
	};
});
//# sourceURL=src/app/router.js
</script>
<script>
// Offline support: registers sw.js and, when a newer build has been
// installed, offers to reload into it. The new worker waits (see sw.js.m4)
// until the user accepts, so a page never runs under another build's cache.
define('app/serviceWorker', ['ui/status', 'actions/files'], (Status, Files) => {
	let reloadRequested = false;

	const reload = async () => {
		reloadRequested = true;
		await Files.flushPendingEdit();
		location.reload();
	};

	const offerUpdate = (worker) => Status.offer('New version available', 'Reload', async () => {
		reloadRequested = true;
		await Files.flushPendingEdit();
		// The reload happens on controllerchange, once the new worker is active.
		worker.postMessage('skipWaiting');
	});

	const register = async () => {
		const container = navigator.serviceWorker;
		// Without a controller the page runs from the network (first install),
		// so there is no older build to replace yet.
		let controlled = !!container.controller;

		container.addEventListener('controllerchange', () => {
			if (!controlled) return void (controlled = true);
			// Another tab accepted the update, so this page now runs on the new
			// worker but still with the old code.
			if (reloadRequested) location.reload();
			else Status.offer('New version installed', 'Reload', reload);
		});

		let registration;
		try {
			registration = await container.register('sw.js');
		} catch (err) {
			return console.error('Service Worker failed', err);
		}

		if (registration.waiting && container.controller) offerUpdate(registration.waiting);
		registration.addEventListener('updatefound', () => {
			const worker = registration.installing;
			worker.addEventListener('statechange', () => {
				if (worker.state === 'installed' && container.controller) offerUpdate(worker);
			});
		});
	};

	return {
		install() {
			// Service workers need http(s); from file:// the app runs without one.
			if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
			window.addEventListener('load', register);
		},
	};
});
//# sourceURL=src/app/serviceWorker.js
</script>

define('lib/dom', [], () => {
	// Tiny element builder: h('li', { class: 'x', onclick: fn }, 'text', childEl)
	const h = (tag, props, ...children) => {
		const el = document.createElement(tag);
		for (const key in props) {
			if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), props[key]);
			else el.setAttribute(key, props[key]);
		}
		children.forEach(c => typeof c === 'string' ? el.appendChild(document.createTextNode(c)) : el.appendChild(c));
		return el;
	};

	// Injects a <script> or stylesheet <link> once, with SRI enforced.
	// `resource` is an entry from the `resources` module: { url, sri }.
	const loadResource = async ({ url, sri }) => {
		return new Promise((resolve, reject) => {
			// Prevent duplicate loading
			if (document.querySelector(`[src="${url}"], [href="${url}"]`)) return resolve();

			const isCss = url.split('?')[0].endsWith('.css');
			const el = document.createElement(isCss ? 'link' : 'script');

			if (isCss) {
				el.rel = 'stylesheet';
				el.href = url;
			} else {
				el.src = url;
			}

			// Apply SRI strict enforcement
			if (sri) {
				el.integrity = sri;
				el.crossOrigin = 'anonymous'; // Required for SRI validation
			}

			el.onload = resolve;
			el.onerror = () => reject(new Error(`Failed to load resource: ${url}`));
			document.head.appendChild(el);
		});
	};

	return { h, loadResource };
});

<script>
define('lib/encoding', [], () => {
	// UTF-8 safe base64 encode/decode for text content.
	const utoa = (text) => btoa(Array.from(new TextEncoder().encode(text)).map(b => String.fromCharCode(b)).join(''));
	const atou = (b64) => new TextDecoder().decode(new Uint8Array(atob(b64.replace(/[\r\n]+/g, '')).split('').map(c => c.charCodeAt(0))));

	// Converts a Blob to a base64 string using chunked reads to stay within
	// call-stack limits for large files (avoids a single massive fromCharCode call).
	const blobToBase64 = async (blob) => {
		const buffer = await new Response(blob).arrayBuffer();
		const bytes = new Uint8Array(buffer);
		let binary = '';
		const chunkSize = 8192;
		for (let i = 0; i < bytes.length; i += chunkSize) {
			binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
		}
		return btoa(binary);
	};

	// Git's blob id for these bytes: SHA-1 of "blob <size>\0" + bytes, which is
	// the sha GitHub lists and expects. Null where crypto.subtle is missing
	// (plain http from another host).
	const gitBlobSha = async (blob) => {
		const subtle = globalThis.crypto && globalThis.crypto.subtle;
		if (!subtle) return null;
		const bytes = new Uint8Array(await new Response(blob).arrayBuffer());
		const header = new TextEncoder().encode(`blob ${bytes.length}\0`);
		const data = new Uint8Array(header.length + bytes.length);
		data.set(header);
		data.set(bytes, header.length);
		const digest = new Uint8Array(await subtle.digest('SHA-1', data));
		return Array.from(digest, b => b.toString(16).padStart(2, '0')).join('');
	};

	return { utoa, atou, blobToBase64, gitBlobSha };
});
//# sourceURL=src/lib/encoding.js
</script>
<script>
define('lib/fileTypes', [], () => {
	const isImageFile = (filename) => /\.(png|jpg|jpeg|gif|svg|webp|ico)$/i.test(filename || '');
	const isPdfFile = (filename) => /\.pdf$/i.test(filename || '');
	const isMarkdownFile = (filename) => /\.(md|markdown)$/i.test(filename || '');
	const isSymlinkFile = (filename) => /\.symlink$/i.test(filename || '');

	const isTextFile = (filename) => {
		// Files with no extension are usually text (e.g., Makefile, .env)
		if (!filename.includes('.')) return true;
		// Add or remove extensions to this regex as needed
		return /\.(txt|md|markdown|rst|csv|json|xml|html|css|js|ts|jsx|tsx|py|yml|yaml|ini|env|sh|bat|m4|ps1|c|cpp|h|rs|go|java|toml|sml|gitignore|symlink)$/i.test(filename);
	};

	// Anything that is not text is transferred and stored as a Blob.
	const isBinaryFile = (filename) => !isTextFile(filename);

	// MIME type for a downloaded binary, so the image/PDF viewers can render it.
	const mimeTypeFor = (filename) => {
		const ext = filename.split('.').pop().toLowerCase();

		let mimeType = 'application/octet-stream';
		if (isPdfFile(filename)) mimeType = 'application/pdf';
		else if (isImageFile(filename)) mimeType = `image/${ext}`;
		if (ext === 'svg') mimeType = 'image/svg+xml';
		if (ext === 'jpg') mimeType = 'image/jpeg';
		return mimeType;
	};

	return { isImageFile, isPdfFile, isMarkdownFile, isSymlinkFile, isTextFile, isBinaryFile, mimeTypeFor };
});

<script>
define('lib/net', [], () => {
	// Default ceiling for any single remote request (GitHub/Dropbox APIs).
	// Chosen to comfortably cover slow mobile connections without leaving
	// the UI hung indefinitely on a stalled socket.
	const NETWORK_TIMEOUT_MS = 10000;

	// A fetch() wrapper that aborts the request after `timeoutMs` and throws
	// a clearly-labeled Error instead of the raw (unhelpful) AbortError.
	// Every remote call in the app routes through this so a stalled network
	// always surfaces a bounded, user-visible failure rather than a silent hang.
	// Callers can pass their own AbortSignal via options.signal; in that case
	// we still race it against our own timeout by aborting our controller
	// whenever the caller's signal aborts.
	//
	// IMPORTANT: fetch() resolves as soon as response *headers* arrive, not
	// once the body has finished downloading. Every call site in this app
	// reads the body (res.json()/res.blob()/res.text()) separately, after
	// fetchWithTimeout has already returned. If we disarmed the timer at
	// that point, a slow body transfer (which is where nearly all of the
	// time goes on a throttled connection, since GitHub/Dropbox payloads
	// are the response body) would run completely unguarded. So instead of
	// clearing the timer here, we hand back the Response with its
	// body-reading methods wrapped: the same timeout budget, and the same
	// AbortController, stay live until the body is actually consumed (or
	// fails), and the timer is only cleared then.
	const fetchWithTimeout = async (url, options = {}, timeoutMs = NETWORK_TIMEOUT_MS) => {
		const controller = new AbortController();
		const timer = setTimeout(() => controller.abort(), timeoutMs);

		const { signal: callerSignal, ...restOptions } = options;
		if (callerSignal) {
			if (callerSignal.aborted) controller.abort();
			else callerSignal.addEventListener('abort', () => controller.abort(), { once: true });
		}

		const timeoutError = () => new Error(`Request timed out. Check your connection and try again.`);

		let res;
		try {
			res = await fetch(url, { ...restOptions, signal: controller.signal });
		} catch (err) {
			clearTimeout(timer);
			throw err.name === 'AbortError' ? timeoutError() : err;
		}

		// Wrap the body-consuming methods so the timeout guard spans the
		// full transfer, not just the initial round trip. Non-body members
		// (res.ok, res.status, res.headers, ...) pass through untouched.
		const bodyMethods = ['json', 'text', 'blob', 'arrayBuffer', 'formData'];
		return new Proxy(res, {
			get(target, prop, receiver) {
				if (bodyMethods.includes(prop)) {
					return async (...args) => {
						try {
							return await target[prop](...args);
						} catch (err) {
							throw err.name === 'AbortError' ? timeoutError() : err;
						} finally {
							clearTimeout(timer);
						}
					};
				}
				const value = Reflect.get(target, prop, target);
				return typeof value === 'function' ? value.bind(target) : value;
			}
		});
	};

	return { NETWORK_TIMEOUT_MS, fetchWithTimeout };
});
//# sourceURL=src/lib/net.js
</script>
<script>
define('lib/path', [], () => {
	// Strips leading and trailing slashes from a path segment.
	// Centralises the normalization pattern used throughout VFS and the provider services.
	const cleanPath = (str) => (str || '').replace(/(^\/+|\/+$)/g, '');

	// Resolves a link target relative to the file that contains it.
	const resolvePath = (basePath, relativePath) => {
		// Ignore external web links and base64 data URIs
		if (relativePath.match(/^(http|https|data:|mailto:|#)/i)) return relativePath;

		const stack = basePath.split('/').slice(0, -1); // Get current directory
		const parts = relativePath.split('/');

		for (const part of parts) {
			if (part === '.') continue;
			if (part === '..') stack.pop();
			else stack.push(part);
		}
		return stack.join('/');
	};

	// Like resolvePath, but for paths that must stay inside one tree: a
	// leading '/' starts at the root, and a '..' above the root gives null
	// instead of being dropped.
	const resolveWithin = (basePath, relativePath) => {
		const stack = relativePath.startsWith('/') ? [] : basePath.split('/').slice(0, -1);
		for (const part of relativePath.split('/')) {
			if (part === '' || part === '.') continue;
			if (part !== '..') stack.push(part);
			else if (!stack.length) return null;
			else stack.pop();
		}
		return stack.join('/');
	};

	const parsePath = (path) => {
		const lastSlash = path.lastIndexOf('/');
		const dir = lastSlash === -1 ? '' : path.substring(0, lastSlash + 1);
		const filename = lastSlash === -1 ? path : path.substring(lastSlash + 1);
		const lastDot = filename.lastIndexOf('.');
		const basename = lastDot === -1 ? filename : filename.substring(0, lastDot);
		return { dir, filename, basename };
	};

	return { cleanPath, resolvePath, resolveWithin, parsePath };
});
//# sourceURL=src/lib/path.js
</script>

define('lib/pkce', [], () => ({
	// Generates a cryptographically random string
	generateCodeVerifier: () => {
		const array = new Uint32Array(28);
		crypto.getRandomValues(array);
		return Array.from(array, dec => ('0' + dec.toString(16)).slice(-2)).join('');
	},

	// Hashes the verifier into a base64-url encoded challenge
	generateCodeChallenge: async (verifier) => {
		const encoder = new TextEncoder();
		const data = encoder.encode(verifier);
		const digest = await crypto.subtle.digest('SHA-256', data);
		return btoa(String.fromCharCode(...new Uint8Array(digest)))
			.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
	},
}));

// Persisted configuration: keychains (credentials), workspaces (mount points),
// pins and the active workspace. This is the only module that touches
// localStorage; everything else reads the fields and calls a save*() method.
define('model/config', [], () => {
	const KEYS = {
		keychains: 'notes_keychains',
		workspaces: 'notes_workspaces',
		activeWorkspace: 'notes_active_workspace',

	const readJson = (key) => JSON.parse(localStorage.getItem(key) || '{}');

	return {
		// Tier 1: The Credentials
		keychains: {},
		// Tier 2: The Mount Points
		workspaces: {},
		activeWorkspaceId: null,
		// Pins, keyed by tree signature (see model/forest)
		treePins: {},

		load() {

			this.workspaces = readJson(KEYS.workspaces);

<script>
// The workspace forest: workspaces that share a remote origin form a tree,
// and each workspace is a mount point (rootDir) within it. Everything here
// is derived from model/config on demand, never stored.
define('model/forest', ['model/config', 'lib/path'], (Config, Path) => {
	const { cleanPath } = Path;

	// Computes a stable string key (the "tree signature") that identifies which
	// remote origin a workspace is rooted in. All workspaces sharing the same
	// signature belong to the same logical file tree ("forest tree").
	const computeTreeSig = (ws, kc) => {
		const provider = kc ? kc.provider : 'github';
		if (provider === 'dropbox') return `dropbox|${ws.keychainId}`;
		if (provider === 'remotestorage') return `remotestorage|${(ws.host || '').trim().replace(/\/+$/, '')}`;
		return `github|${ws.host}|${ws.owner}|${ws.repo}|${ws.branch}`;
	};

	const Forest = {
		computeTreeSig,

		activeTreeSignature() {
			const ws = Config.activeWorkspace;
			if (!ws) return null;
			return computeTreeSig(ws, Config.activeKeychain);
		},

		// { treeSignature: [workspaceId, ...] }
		workspaceTrees() {
			const trees = {};

			for (const [id, ws] of Object.entries(Config.workspaces)) {
				const kc = Config.keychains[ws.keychainId];
				const sig = computeTreeSig(ws, kc);
				if (!trees[sig]) trees[sig] = [];
				trees[sig].push(id);
			}

			// Sort each tree's workspace IDs by rootDir length (deepest paths first)
			// so the Router always evaluates the most specific "Best Fit" workspace first.
			for (const sig in trees) {
				trees[sig].sort((a, b) => {
					const rootA = cleanPath(Config.workspaces[a].rootDir);
					const rootB = cleanPath(Config.workspaces[b].rootDir);
					return rootB.length - rootA.length;
				});
			}

			return trees;
		},

		// Pins are stored at the tree (forest) level.
		activePins() {
			const sig = this.activeTreeSignature();
			return sig && Config.treePins[sig] ? Config.treePins[sig] : [];
		},

		// The workspace ids of one tree, deepest mount first (default: the active tree).
		_treeIds(sig = this.activeTreeSignature()) {
			if (!sig) return null;
			return this.workspaceTrees()[sig] || [];
		},

		// 1. Local -> Global: Gets the absolute forest path for a local file
		getAbsolutePath(workspaceId, filename) {
			const ws = Config.workspaces[workspaceId];
			if (!ws) return cleanPath(filename);

			const cleanRoot = cleanPath(ws.rootDir);
			const cleanFile = cleanPath(filename);
			return [cleanRoot, cleanFile].filter(Boolean).join('/');
		},

		// 2. Global -> Local: Slices a forest path down for a specific workspace.
		// Null if the path is outside the workspace's root.
		getRelativePath(workspaceId, absolutePath) {
			const targetRoot = cleanPath(Config.workspaces[workspaceId].rootDir);
			if (!targetRoot) return absolutePath;
			if (absolutePath === targetRoot) return '';
			if (absolutePath.startsWith(targetRoot + '/')) return absolutePath.substring(targetRoot.length + 1);
			return null;
		},

		// 3. The Router: Finds the deepest workspace mounted for an absolute path,
		// in the active tree or the one named by `sig`
		resolveBestFit(absolutePath, sig) {
			const treeWsIds = this._treeIds(sig);
			if (!treeWsIds) return null;

			return treeWsIds.find(id => {
				const targetRoot = cleanPath(Config.workspaces[id].rootDir);
				return targetRoot === '' || absolutePath === targetRoot || absolutePath.startsWith(targetRoot + '/');
			});
		},

		// 4. The Mapper: Finds sub-workspaces that should appear as folders locally
		getVirtualMounts() {
			const treeWsIds = this._treeIds();
			if (!treeWsIds) return [];

			const currentRoot = cleanPath(Config.activeWorkspace.rootDir);
			const virtuals = [];

			treeWsIds.forEach(id => {
				if (id === Config.activeWorkspaceId) return;

				const targetRoot = cleanPath(Config.workspaces[id].rootDir);
				if (targetRoot && (currentRoot === '' || targetRoot.startsWith(currentRoot + '/'))) {
					const relativePath = currentRoot === '' ? targetRoot : targetRoot.substring(currentRoot.length + 1);
					virtuals.push(relativePath);
				}
			});

			return virtuals;
		},

		// 5. Exact Mount: Finds if a path is the explicit root of a sub-workspace
		getExactMount(absolutePath) {
			const treeWsIds = this._treeIds();
			if (!treeWsIds) return null;

			return treeWsIds.find(id => {
				const targetRoot = cleanPath(Config.workspaces[id].rootDir);
				return targetRoot === absolutePath;
			});
		},

		// 6. Leaf constraint: another workspace of the same tree is mounted strictly
		// below this one (an equal root is a sibling, not a child). A deep listing
		// would then also cache that mount's files, so the workspace must be shallow.
		hasMountsBelow(workspaceId) {
			const ws = Config.workspaces[workspaceId];
			const sig = computeTreeSig(ws, Config.keychains[ws.keychainId]);
			const root = cleanPath(ws.rootDir);
			return (this.workspaceTrees()[sig] || []).some(id => {
				const childRoot = cleanPath(Config.workspaces[id].rootDir);
				return id !== workspaceId && childRoot !== root && (root === '' || childRoot.startsWith(root + '/'));
			});
		},

		// 7. Navigation: Finds the nearest parent workspace for the current view
		getParentWorkspace() {
			const absolutePath = this.getAbsolutePath(Config.activeWorkspaceId, '');
			if (!absolutePath) return null; // We are at the absolute root

			// By finding the best fit for our own parent directory, we find the immediate mount point above us
			const parentDir = absolutePath.includes('/') ? absolutePath.substring(0, absolutePath.lastIndexOf('/')) : '';
			return this.resolveBestFit(parentDir);
		},
	};

	return Forest;
});

<script>
// Targets: one string naming a file or folder in any configured tree, used
// by the URL hash and by .symlink files.
//
//   <origin>:<path>     github:rust-lang/nomicon@master:src/intro.md
//                       github://ghe.example.com/api/v3/team/wiki@main:index.md
//                       rs:https://192.168.1.10:8765/storage:notes/a.md
//                       dropbox:Notes/todo.md
//   ./x  ../x  /x       relative to a link's folder, or its tree's root (symlinks only)
//
// The path is absolute in the tree, without a leading slash ('' is the root).
// Origin and path are split at the configured origin that the target starts
// with (the longest), never by parsing, so branches with '/' and paths with
// ':' need no escaping.
define('model/target', ['model/config', 'model/forest', 'lib/path'], (Config, Forest, Path) => {
	const GITHUB_API = 'https://api.github.com';

	const originOf = (ws, kc) => {
		const provider = kc ? kc.provider : 'github';
		const host = (ws.host || '').trim().replace(/\/+$/, '');
		if (provider === 'dropbox') return 'dropbox';
		if (provider === 'remotestorage') return `rs:${host}`;
		const repo = `${ws.owner}/${ws.repo}@${ws.branch}`;
		return !host || host === GITHUB_API ? `github:${repo}` : `github://${host.replace(/^https:\/\//, '')}/${repo}`;
	};

	// GitHub owner and repo are case-insensitive; the branch is not.
	const startsWithOrigin = (text, origin) => {
		if (text.length < origin.length) return false;
		const head = text.slice(0, origin.length);
		const exact = origin.startsWith('github') ? origin.lastIndexOf('@') : 0;
		return head.slice(0, exact).toLowerCase() === origin.slice(0, exact).toLowerCase()
			&& head.slice(exact) === origin.slice(exact)
			&& (text.length === origin.length || text[origin.length] === ':');
	};

	const isRelative = (text) => /^(\.\.?(\/|$)|\/)/.test(text);

	const Target = {
		originOf,

		// [{ origin, sig }] for every configured tree. Trees with the same origin
		// (several Dropbox keychains) resolve to the first.
		origins() {
			const seen = new Set();
			const list = [];
			for (const [sig, ids] of Object.entries(Forest.workspaceTrees())) {
				const ws = Config.workspaces[ids[0]];
				const origin = originOf(ws, Config.keychains[ws.keychainId]);
				if (seen.has(origin)) continue;
				seen.add(origin);
				list.push({ origin, sig });
			}
			return list;
		},

		// The target of a file (or, with no filename, the root) of a workspace.
		forWorkspace(workspaceId, filename = '') {
			const ws = Config.workspaces[workspaceId];
			const origin = originOf(ws, Config.keychains[ws.keychainId]);
			const path = Forest.getAbsolutePath(workspaceId, filename);
			return path ? `${origin}:${path}` : origin;
		},

		// For the URL hash: only what would break a URL is encoded.
		encode: (target) => encodeURI(target).replace(/[#?]/g, encodeURIComponent),
		decode(hash) {
			try { return decodeURIComponent(hash); } catch { return hash; }
		},

		// { workspaceId, filename } for a target, or { error }. `from` is the
		// { sig, path } of the .symlink holding a relative target.
		resolve(text, { from } = {}) {
			text = (text || '').trim();
			let sig, path;
			if (isRelative(text)) {
				if (!from) return { error: `A relative target ("${text}") only works in a symlink.` };
				path = Path.resolveWithin(from.path, text);
				if (path === null) return { error: `"${text}" goes above the repository root.` };
				sig = from.sig;
			} else {
				const match = Target.origins()
					.filter(o => startsWithOrigin(text, o.origin))
					.sort((a, b) => b.origin.length - a.origin.length)[0];
				if (!match) return { error: `No workspace for "${text}".` };
				sig = match.sig;
				path = Path.cleanPath(text.slice(match.origin.length + 1));
			}
			const workspaceId = Forest.resolveBestFit(path, sig);
			if (!workspaceId) return { error: `No workspace holds "${path}" in that repository.` };
			return { workspaceId, filename: Forest.getRelativePath(workspaceId, path) };
		},
	};

	return Target;
});

<script>
// Markdown notes: a textarea to edit, and a rendered view with KaTeX math and
// highlighted code. Local images are read through the plugin host, which
// also tells the view when one of them is stored or changed.
define('plugins/markdown',
	['lib/dom', 'lib/fileTypes', 'plugins/textEditor', 'ui/status', 'resources'],
	(Dom, FileTypes, TextEditor, Status, R) => {

	let depsLoaded = false;
	const loadDeps = async () => {
		if (depsLoaded) return;
		Status.show('Loading Markdown engine...', false);
		await Promise.all([
			Dom.loadResource(R.marked),
			Dom.loadResource(R.dompurify),
			Dom.loadResource(R.katexCss),
			Dom.loadResource(R.katexJs),
			Dom.loadResource(R.highlightJs),
			Dom.loadResource(R.highlightCss),
		]);

		// Load the extension after KaTeX has been loaded
		await Dom.loadResource(R.markedKatex);

		marked.use(
			// nonStandard: inline $…$ renders next to any character, as in ($x$) or
			// $x$'s. Write \$ for a literal dollar sign beside another one.
			window.markedKatex({ throwOnError: false, output: 'html', nonStandard: true }),
			{
				renderer: {
					image(token) {
						// Hold the URL in data-src, so nothing loads before renderMarkdown decides
						return `<img data-src="${token.href}" alt="${token.text || ''}" title="${token.title || ''}" />`;
					}
				}
			});
		depsLoaded = true;
		Status.show('Markdown engine loaded.');
	};

	return {
		canHandle: (fn) => FileTypes.isMarkdownFile(fn),
		create: () => ({
			name: 'MarkdownPlugin',
			supportedModes: ['edit', 'view'],
			textarea: null,
			viewLayer: null,
			filename: null,
			host: null,
			isViewMode: false,
			unsubscribe: null,
			// Only the latest of overlapping renders updates the view.
			renders: 0,

			mount: async function(filename, content, viewLayer, editLayer, saveCallback, { isViewMode, host } = {}) {
				this.filename = filename;
				this.viewLayer = viewLayer;
				this.host = host || null;
				this.isViewMode = !!isViewMode;

				// Ask the factory for a standard editor, but the plugin still OWNS it
				this.textarea = TextEditor.create(content, saveCallback);
				editLayer.appendChild(this.textarea);

				// An image pulled, pasted or edited elsewhere shows without reopening the note.
				if (this.host) this.unsubscribe = this.host.onChange(() => this.isViewMode && this.renderMarkdown());

				if (isViewMode) await this.renderMarkdown();
			},

			onModeSwitch: async function(isViewMode) {
				this.isViewMode = isViewMode;
				if (isViewMode) await this.renderMarkdown();
				else this.textarea.focus();
			},

			// The stored image for a local src, through the host. Null when it isn't
			// stored, or the path is refused (e.g. above the repo root).
			readImage: async function(src) {
				if (!this.host) return null;
				try {
					const file = await this.host.read(src);
					return file && file.content instanceof Blob ? file.content : null;
				} catch (err) {
					console.warn(`Image ${src}:`, err.message);
					return null;
				}
			},

			renderMarkdown: async function() {
				const render = ++this.renders;
				await loadDeps();
				if (!this.textarea || render !== this.renders) return;

				let processedText = this.textarea.value
				        // Ensure block math has a preceding empty line (prevents it being swallowed by paragraphs)
				        .replace(/([^\n])\n(\s*\$\$)/g, '$1\n\n$2')
				        // Ensure block math has a following empty line
				        .replace(/(\$\$\s*)\n([^\n])/g, '$1\n\n$2');

				// 1. Register a secure hook BEFORE sanitization
				// This safely enforces new tabs for all links during the sanitization pass
				DOMPurify.addHook('afterSanitizeAttributes', function(node) {
				    if (node.tagName === 'A') {
				        node.setAttribute('target', '_blank');
				        node.setAttribute('rel', 'noopener noreferrer');
				    }
				    // An HTML <img> with a local src is looked up like a Markdown image.
				    if (node.tagName === 'IMG' && node.hasAttribute('src') && !/^(https?:|data:)/i.test(node.getAttribute('src'))) {
				        node.setAttribute('data-src', node.getAttribute('src'));
				        node.removeAttribute('src');
				    }
				});

				const rawHtml = marked.parse(processedText);

				// 2. Execute sanitization using explicit Allowlist Profiles
				const safeFragment = DOMPurify.sanitize(rawHtml, {
				    // Explicitly enable only the specific safe-lists we need.
				    // By default, this obliterates all scripts, iframes, objects, and dangerous event handlers.
				    USE_PROFILES: {
				        html: true,   // Standard safe HTML (p, h1, a, strong, img, etc.)
				        mathMl: true, // Required for KaTeX equations
				        svg: true     // Required for KaTeX root/fraction symbols
				    },

				    // Explicitly enforce allowed URI schemes.
				    // This strictly blocks `<a href="javascript:alert(1)">` vectors.
				    ALLOWED_URI_REGEXP: /^(?:(?:(?:f|ht)tps?|mailto|tel|callto|cid|xmpp):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i,
					RETURN_DOM_FRAGMENT: true,
					ADD_ATTR: ['data-src'],
				});

				safeFragment.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));

				// Remove the hook after use so it doesn't bleed into other plugins
				DOMPurify.removeHook('afterSanitizeAttributes');

				const imgPromises = Array.from(safeFragment.querySelectorAll('img')).map(async (img) => {
					// Read from our safe data attribute
					const src = img.getAttribute('data-src');
					if (!src) return;

					if (!src.match(/^(http|https|data:)/i)) {
						// Local image, from the stored copy
						const blob = await this.readImage(src);
						if (blob) {
							const objectUrl = URL.createObjectURL(blob);
							img.src = objectUrl; // Assigning the real src safely
							img.onload = () => URL.revokeObjectURL(objectUrl);
						} else {
							img.alt = `[Image missing locally: ${src}]`;
						}
					} else {
						// Remote image: the browser loads it (see backlog, Deferred)
						img.src = src;
					}
				});

				await Promise.all(imgPromises);

				if (this.viewLayer && render === this.renders) this.viewLayer.replaceChildren(safeFragment);
			},

			freeze: function() {
				if (this.textarea) {
					this.textarea.disabled = true;
				}
			},

			unmount: function() {
				if (this.unsubscribe) this.unsubscribe();
				this.unsubscribe = null;
				this.host = null;
				this.textarea = null;
				this.viewLayer = null;
				this.filename = null;
			}
		}),
	};
});

define('plugins/text', ['lib/dom', 'lib/fileTypes', 'plugins/textEditor', 'resources'], (Dom, FileTypes, TextEditor, R) => {
	const { h } = Dom;

	let depsLoaded = false;
	const loadDeps = async () => {
		if (depsLoaded) return;
		await Promise.all([
			Dom.loadResource(R.highlightCss),
			Dom.loadResource(R.highlightJs)
		]);
		depsLoaded = true;
	};

	return {
		canHandle: (fn) => (FileTypes.isTextFile(fn) && !FileTypes.isMarkdownFile(fn)) || FileTypes.isSymlinkFile(fn),
		create: () => ({
			name: 'TextPlugin',
			supportedModes: ['edit', 'view'],
			textarea: null,
			viewLayer: null,
			filename: null,

			mount: async function(filename, content, viewLayer, editLayer, saveCallback, { isViewMode } = {}) {
				this.filename = filename;
				this.viewLayer = viewLayer;

				this.textarea = TextEditor.create(content, saveCallback);
				editLayer.appendChild(this.textarea);

				if (isViewMode) await this.renderText(filename);
			},

			onModeSwitch: async function(isViewMode) {
				// We need filename for extension detection in syntax highlighting
				if (isViewMode) await this.renderText(this.filename);
				else this.textarea.focus();
			},

			renderText: async function(filename) {
				await loadDeps();
				const ext = filename.split('.').pop().toLowerCase();
				this.viewLayer.replaceChildren(h('pre', {}, h('code', { class: "language-" + ext }, this.textarea.value)));
				this.viewLayer.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
			},
			freeze: function() {
				if (this.textarea) {
					this.textarea.disabled = true;
				}
			},
			unmount: function() {
				this.textarea = null;
				this.viewLayer = null;
				this.filename = null;
			}
		}),
	};
});

<script>
// The plain <textarea> editor shared by the text-based plugins.
define('plugins/textEditor', [], () => ({
	create(content, saveCallback) {
		const textarea = document.createElement('textarea');
		textarea.style.cssText = 'display: block; width: 100%; height: 100%; box-sizing: border-box; padding: 20px; border: none; resize: none; outline: none; font-family: monospace; font-size: 15px; line-height: 1.5;';
		textarea.value = typeof content === 'string' ? content : '';

		// Auto-save hook
		textarea.addEventListener('input', (e) => saveCallback(e.target.value));

		// Standard Tab key indentation
		textarea.addEventListener('keydown', function(e) {
			if (e.key === 'Tab') {
				e.preventDefault();
				document.execCommand('insertText', false, '    ');
				saveCallback(this.value);
			}
		});

		return textarea;
	},
}));
